  <div class="pctop"><div class="pco"><b>${o.ovr??ov}</b><span>${o.pos||c.pos}</span></div>${avatar(cardSeed(c),56,c.team.c1,c.team.c2)}</div>
  <div class="pn">${esc(c.ln)}</div><div class="pf">${f.map(([k,v])=>`<span><b>${v}</b>${k}</span>`).join('')}</div><div class="pa">${esc(c.team.abbr||'')} · ${esc(natFlag(c.nat))}${o.chem!=null?' · '+synMark(o.chem):''}</div><div class="lv">${[1,2,3,4,5].map(i=>`<i class="${(c.lvl||0)>=i?'on':''}"></i>`).join('')}</div></button>`}
function coachHTML(k,o={}){return`<button class="pc coachc ${rarity(k.ovr)} ${MT.coach===k.uid?'sel':''}" data-a="${o.act||'mcoach|'+k.uid}" aria-label="Coach ${esc(k.name)}, ${k.ovr}"><div class="pctop"><div class="pco"><b>${k.ovr}</b><span>HC</span></div>${avatar(k.seed,56,'#1d2a3a','#d4a31b')}</div>
  <div class="pn">${esc(k.name.split(' ').slice(-1)[0])}</div><div class="pf"><span><b>+${k.f}</b>FWD</span><span><b>+${k.d}</b>DEF</span></div><div class="pa">${esc(k.style)}</div>${MT.coach===k.uid?'<div class="pa y">Behind the bench</div>':''}</button>`}
const MTICON={lines:ICON.team,cards:'<svg viewBox="0 0 48 44"><rect x="8" y="8" width="20" height="28" rx="2.5" fill="currentColor" transform="rotate(-10 18 22)"/><rect x="20" y="6" width="20" height="28" rx="2.5" fill="currentColor" stroke="#2c2c2c" stroke-width="2" transform="rotate(8 30 20)"/></svg>',
 store:'<svg viewBox="0 0 48 44"><path d="M10 14h28l-2.5 24h-23z" fill="currentColor"/><path d="M17 16 V11 a7 7 0 0 1 14 0 V16" stroke="currentColor" stroke-width="3" fill="none"/></svg>',
 ch:'<svg viewBox="0 0 48 44"><path d="M15 5h18v9c0 6-4 10-9 10s-9-4-9-10z M15 8H9c0 6 3 9 6 9 M33 8h6c0 6-3 9-6 9 M24 24v7 M17 38h14 M19 31h10v7H19z" fill="currentColor" stroke="currentColor" stroke-width="1.6"/></svg>'};
function mtSlotBtn(grp,i,j,lbl,chem){const u=grp==='G'?MT.G[i]:MT[grp][i][j];const c=mtCard(u);const pos=grp==='F'?SLOT_POS[j]:grp==='D'?'D':'G';const o=c?cardAt(c,pos):0;
  const oop=c&&(grp==='G'?c.pos!=='G':grp==='D'?c.pos!=='D':(c.pos==='D'||c.pos==='G'||(c.pos!==pos&&!(c.sec||[]).includes(pos)&&(pos==='C'||c.pos==='C'))));
  return`<button class="lslot ${oop?'oop':''}" data-a="mslot|${grp}|${i}|${j??0}" aria-label="${lbl}: ${c?esc(c.fn+' '+c.ln):'empty'}">${c?avatar(cardSeed(c),34,c.team.c1,c.team.c2):'<span class="addp">+</span>'}<span class="ln">${c?esc(c.ln):'Add'}</span><span class="lp"><b style="color:${c?tierC(o):'#888'}">${c?o:'—'}</b> ${lbl}</span>${c&&chem!=null?synMark(chem):''}</button>`}
function mtLines(){const ch=mtChem();const F=MT.F.map((l,i)=>`<div class="lrow"><div class="lval">L${i+1}</div>${l.map((u,j)=>mtSlotBtn('F',i,j,SLOT_POS[j],ch.F[i][j])).join('')}</div>`).join('');
  const D=MT.D.map((l,i)=>`<div class="lrow two"><div class="lval">D${i+1}</div>${l.map((u,j)=>mtSlotBtn('D',i,j,j?'RD':'LD',ch.D[i][j])).join('')}</div>`).join('');
  const G=`<div class="lrow two"><div class="lval">G</div>${mtSlotBtn('G',0,0,'Starter',ch.G[0])}${mtSlotBtn('G',1,0,'Backup',ch.G[1])}</div>`;
  return`<div class="lab" style="margin:0 0 6px">Forward lines</div>${F}<div class="lab" style="margin:14px 0 6px">Defense pairs</div>${D}<div class="lab" style="margin:14px 0 6px">Goalies</div>${G}`}
function vMT(){const rt=mtRatings();const ch=mtChem();const tab=UI.mtTab||'lines';const k=mtCoach();let b='';
  if(tab==='lines'){b=`${panel('Team rating',`<div class="ringrow"><div><span class="lb">OFF</span>${ring(rt.off,{s:84,lbl:''})}</div><div class="big" style="padding-bottom:12%">${ring(rt.ovr,{s:104,lbl:'',fill:true})}</div><div><span class="lb">DEF</span>${ring(rt.def,{s:84,lbl:''})}</div></div><p class="sm dim" style="text-align:center;margin:6px 0 0">Goalie ${rt.gk}</p>`)}
    ${panel(`Line synergy ${ch.tot}/48`,`<p class="sm dim" style="margin-top:0">Linemates from the same club, nation or league link up. Stars from your own saves always add one. Your coach adds synergy to every forward line or defense pair. Each point boosts that player's ratings in games.</p>${meter(ch.tot/48)}
      <button class="trow" style="grid-template-columns:48px minmax(0,1fr) auto;margin-top:12px" data-a="coachpick">${k?avatar(k.seed,40,'#1d2a3a','#d4a31b'):'<span></span>'}<div style="min-width:0"><div>${k?esc(k.name):'No coach'}</div><div class="sm dim">${k?`${esc(k.style)} · +${k.f} forwards · +${k.d} defense`:'Pick a coach card'}</div></div><span class="sm y">Change ›</span></button>`)}
    ${panel('Lines',mtLines())}<div class="acts" style="margin-bottom:12px"><button class="btn go" data-a="mtauto">Auto-fill best lines</button></div>`}
  else if(tab==='cards'){let cs=MT.cards.slice();const F=UI.mtF||'ALL';if(F==='STAR')cs=cs.filter(isLeagueCard);else if(F==='F')cs=cs.filter(c=>isF(c));else if(F!=='ALL'&&F!=='HC')cs=cs.filter(c=>c.pos===F);if(UI.mtSort==='new')cs.reverse();else cs.sort((a,b)=>cOvr(b)-cOvr(a));
    b=`<div class="chips" style="margin-bottom:10px"><button class="${F==='STAR'?'on':''}" data-a="mtf|STAR">★ Starred</button>${[['ALL','All'],['F','Forwards'],['C','C'],['LW','LW'],['RW','RW'],['D','D'],['G','G'],['HC','Coaches']].map(([p,l])=>`<button class="${p===F?'on':''}" data-a="mtf|${p}">${l}</button>`).join('')}</div>${F!=='HC'?`<div style="margin-bottom:12px">${seg('mts',[['ovr','Best'],['new','Newest']],UI.mtSort||'ovr')}</div>`:''}
    ${F==='HC'?`<div class="cards">${MT.coaches.map(x=>coachHTML(x)).join('')}</div>`:cs.length?`<div class="cards">${cs.map(c=>cardHTML(c)).join('')}</div>`:panel('Collection',`<p class="dim" style="margin:0">${F==='STAR'?'No starred players yet. In Franchise, MyGM or Be a Pro, tap ☆ on any player to keep his card here.':'No cards here.'}</p>`)}`}
  else if(tab==='play'){const opp=mtOpp();const or=Math.round(avg(opp.F.flat().concat(opp.D.flat(),[opp.G[0]]).map(c=>cOvr(c))));
    b=panel(`Rivals · Division ${MT.div}`,`<div class="ladder">${Array.from({length:10},(_,i)=>{const d=10-i;return`<span class="${d>MT.div?'done':d===MT.div?'cur':''}">${d}</span>`}).join('')}</div>
    <div class="sm dim" style="margin-top:10px">Points this division: ${MT.pts||0}/8 · Win 2, overtime loss 1.</div>${meter((MT.pts||0)/8)}
    <div style="display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:22px 0 10px"><div style="display:grid;justify-items:center;gap:6px"><span class="up">My Team</span>${ring(rt.ovr,{s:80})}</div><span class="dim" style="font-size:24px">vs</span><div style="display:grid;justify-items:center;gap:6px;text-align:center"><span class="up" style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(opp.team.name)}</span>${ring(or,{s:80})}</div></div>
    <p class="sm dim" style="text-align:center">${esc(opp.team.lg)} · Win ${(1000+(10-MT.div)*180).toLocaleString()} coins · OT loss 450 · Loss 200</p><div style="display:grid;gap:10px"><button class="btn go wide" data-a="mtplay|rivals|1">Play live</button><button class="btn wide" data-a="mtplay|rivals|0">Quick sim</button></div>`)
    +panel('Squad Battles',`<p class="dim" style="margin-top:0">Play a computer squad built around your rating. Harder levels pay more.</p>${SB_LV.map((s,i)=>rowLine(`<div><div>${s[0]}</div><div class="sm dim">Opponent about ${Math.round(rt.ovr+s[1])} · win ${s[2].toLocaleString()} coins</div></div>`,`<div class="acts" style="flex-wrap:nowrap"><button class="btn s go" data-a="mtplay|sb|1|${i}">Live</button><button class="btn s" data-a="mtplay|sb|0|${i}">Sim</button></div>`)).join('')}`)
    +panel('Record',`<div class="tiles">${tile('Won',MT.w,'g')}${tile('OT loss',MT.otl||0,'y')}${tile('Lost',MT.l,'r')}</div>`)}
  else if(tab==='store'){b=PACKS.map(pk=>panel(`${pk.name} · ${pk.cost.toLocaleString()}`,`<p class="dim" style="margin-top:0">${pk.desc}</p>${pk.id==='pos'?`<div class="chips">${['C','LW','RW','D','G'].map(p=>`<button data-a="buy|pos|${p}" ${MT.coins<pk.cost?'disabled':''}>${p}</button>`).join('')}</div>`:`<button class="btn go" data-a="buy|${pk.id}" ${MT.coins<pk.cost?'disabled':''}>Open pack</button>`}`)).join('')
    +panel('Earn coins',"<p class=\"dim\" style=\"margin:0\">Win games, climb Rivals divisions, finish objectives and sell pack cards. Starred league players can't be sold.</p>")}
  else{b=MT_CH.map(c=>{const done=!!MT.claimed[c.id];const ok=c.chk();return panel(c.n,`<p class="dim" style="margin-top:0">${c.d}</p><div style="display:flex;justify-content:space-between;align-items:center"><span class="y">${c.r.toLocaleString()} coins</span>${done?'<span class="tag g">Claimed</span>':`<button class="btn s ${ok?'go':''}" data-a="claim|${c.id}" ${ok?'':'disabled'}>${ok?'Claim':'Not yet'}</button>`}</div>`)}).join('')}
  const nb=(k,l)=>`<button class="${tab===k?'on':''}" data-a="mtt|${k}">${MTICON[k]}<span>${l}</span></button>`;
  return`<div class="app"><div class="top"><button class="tback" data-a="home" aria-label="Main menu">‹</button><h1>MY TEAM</h1><span></span></div><div class="gut">
  <div class="status"><span class="ok">${MT.coins.toLocaleString()} coins</span><span>${MT.cards.length} cards · Division ${MT.div}</span></div>${b}</div>
  <nav class="bnav" aria-label="My Team">${nb('lines','Lines')}${nb('cards','Cards')}<button class="play" data-a="mtt|play" aria-label="Play"><span>${ICON.play}</span></button>${nb('store','Store')}${nb('ch','Objectives')}</nav></div>`}
A.mtt=k=>{UI.mtTab=k;render()};A.mtf=f=>{UI.mtF=f;render()};A.mts=s=>{UI.mtSort=s;render()};A.mtauto=()=>{mtAutoLineup();toast('Best lines set','good');render()};
A.mtplay=(kind,w,lv)=>mtStartGame(kind,w==='1',lv);A.buy=(id,pos)=>openPack(id,typeof pos==='string'?pos:null);A.claim=id=>{claim(id);render()};
A.mcard=uid=>openM({type:'card',uid});A.mslot=(grp,i,j)=>openM({type:'slot',grp,i:+i,j:+j});A.coachpick=()=>openM({type:'coachpick'});A.mcoach=uid=>openM({type:'coachpick',sel:uid});
function vCardM(m){const c=mtCard(m.uid);if(!c)return scrTop('CARD');const st=MT.stats[c.uid]||{};const fs=isLeagueCard(c);const r=cR(c);const keys=c.pos==='G'?G_GRP[0][1]:Object.keys(POSW[c.pos]).filter(k=>POSW[c.pos][k]>.03);
  let where='';MT.F.forEach((l,i)=>l.forEach((u,j)=>{if(u===c.uid)where=`Line ${i+1} ${SLOT_POS[j]}`}));MT.D.forEach((l,i)=>l.forEach(u=>{if(u===c.uid)where=`Pair ${i+1}`}));if(MT.G[0]===c.uid)where='Starting goalie';if(MT.G[1]===c.uid)where='Backup goalie';
  return`${scrTop(c.pos+' CARD')}<div class="gut"><div class="hero">${avatar(cardSeed(c),96,c.team.c1,c.team.c2)}<div style="min-width:0;flex:1"><div class="sm dim up">${c.pos} · ${esc(c.arch||'')}${where?' · '+where:''}</div><h2>${esc(c.fn+' '+c.ln)}</h2><div class="dim">${fs?`Starred from your ${c.src==='mygm'?'MyGM career':c.src==='myplayer'?'Be a Pro career':'franchise'}: `:''}${esc(c.team.name)} · ${esc(c.team.lg||'')} · ${esc(c.nat||'')}</div>
   ${c.aw&&c.aw.length?`<div class="sm y" style="margin-top:4px">${c.aw.map(esc).join(' · ')}${c.rings?` · ${c.rings} Cup${c.rings>1?'s':''}`:''}</div>`:''}</div>${ring(cOvr(c),{s:84})}</div>
  <div class="fcrow">${faces(r,c.pos==='G').map(([k,v])=>`<div><b style="color:${tierC(v)}">${v}</b><span>${k}</span></div>`).join('')}</div>
  ${panel('Key attributes',keys.map(a=>`<div class="attr"><span class="n">${ATTR_NAME[a]}</span><b>${r[a]}</b><span class="t"><i style="width:${r[a]}%;background:${tierC(r[a])}"></i></span></div>`).join(''))}
  ${panel('My Team stats',`<div class="tiles">${tile('Games',st.gp||0)}${c.pos==='G'?tile('Wins',st.w||0)+tile('Save %',st.sa?f3((st.sa-(st.ga||0))/st.sa):'—'):tile('Goals',st.gl||0)+tile('Assists',st.a||0)+tile('+/-',pm(st.pm||0))}</div>`)}
  <div style="display:grid;gap:10px;margin-bottom:20px">${(c.lvl||0)<5&&cOvr(c)<99?`<button class="btn go wide" data-a="mtrain|${c.uid}" ${MT.coins<trainCost(c)?'disabled':''}>Train +1 OVR · ${trainCost(c).toLocaleString()}</button>`:'<span class="tag g" style="justify-self:start">Fully trained</span>'}
   <button class="btn red wide" data-a="msell|${c.uid}">${fs?'Remove card':`Sell for ${SELL[rarity(c.ovr)].toLocaleString()}`}</button></div></div>`}
A.mtrain=uid=>{trainCard(uid);renderModal();render()};A.msell=uid=>{const c=mtCard(uid);if(UI.modal.confirm!==uid&&isLeagueCard(c)){UI.modal.confirm=uid;toast('Tap again to remove this starred card for good.','bad');return}sellCard(uid);closeM();render()};
function vSlot(m){const{grp,i,j}=m;const pos=grp==='F'?SLOT_POS[j]:grp==='D'?'D':'G';const cur=mtCard(grp==='G'?MT.G[i]:MT[grp][i][j]);const lbl=grp==='F'?`Line ${i+1} ${pos}`:grp==='D'?`Pair ${i+1} ${j?'RD':'LD'}`:i?'Backup goalie':'Starting goalie';
  const cs=MT.cards.filter(c=>(pos==='G')===(c.pos==='G')).sort((a,b)=>cardAt(b,pos)-cardAt(a,pos));const inUse=uid=>MT.F.flat().includes(uid)||MT.D.flat().includes(uid)||MT.G.includes(uid);
  return`${scrTop(lbl.toUpperCase())}<div class="gut" style="padding-top:18px"><p class="sm dim" style="margin-top:0">Ratings shown at ${pos}. Players out of position add no synergy. Picking someone already dressed swaps the two.</p>${cs.length?`<div class="cards">${cs.map(c=>`<div><div class="slotl">${c===cur?'Current':inUse(c.uid)?'Dressed':'&nbsp;'}</div>${cardHTML(c,{act:'setslot|'+grp+'|'+i+'|'+j+'|'+c.uid,pos:cardAt(c,pos)!==cOvr(c)?pos:null,ovr:cardAt(c,pos)})}</div>`).join('')}</div>`:`<p class="dim">No cards for this position. Open a position pack in the Store.</p>`}
  <div class="acts" style="margin:18px 0">${cur?`<button class="btn" data-a="mcard|${cur.uid}">View current card</button>`:''}</div></div>`}
A.setslot=(grp,i,j,uid)=>{i=+i;j=+j;const get=(g,a,b)=>g==='G'?MT.G[a]:MT[g][a][b];const set=(g,a,b,v)=>{if(g==='G')MT.G[a]=v;else MT[g][a][b]=v};const cur=get(grp,i,j);
  let from=null;MT.F.forEach((l,a)=>l.forEach((u,b)=>{if(u===uid)from=['F',a,b]}));MT.D.forEach((l,a)=>l.forEach((u,b)=>{if(u===uid)from=['D',a,b]}));MT.G.forEach((u,a)=>{if(u===uid)from=['G',a,0]});
  if(from)set(from[0],from[1],from[2],cur);set(grp,i,j,uid);mtSave();closeM();render()};
function vCoachPick(m){const sel=m.sel?MT.coaches.find(k=>k.uid===m.sel):null;return`${scrTop('COACHES')}<div class="gut" style="padding-top:18px"><p class="sm dim" style="margin-top:0">Your coach adds synergy to every forward line (FWD) and defense pair (DEF), and his rating gives your team a small edge. Get more coaches from the Coach pack.</p>
  ${sel?panel(esc(sel.name),`<p class="dim" style="margin-top:0">${esc(sel.style)} · Rating ${sel.ovr} · +${sel.f} forward synergy · +${sel.d} defense synergy</p><div class="acts">${MT.coach===sel.uid?'<span class="tag g">Behind the bench</span>':`<button class="btn go" data-a="setcoach|${sel.uid}">Hire</button>`}${MT.coach!==sel.uid?`<button class="btn red" data-a="sellcoach|${sel.uid}">Release · 300</button>`:''}</div>`):''}
  <div class="cards">${MT.coaches.map(k=>coachHTML(k,{act:'mcoach|'+k.uid})).join('')}</div></div>`}
A.setcoach=uid=>{MT.coach=uid;mtSave();toast('New coach hired','good');closeM();render()};A.sellcoach=uid=>{MT.coaches=MT.coaches.filter(k=>k.uid!==uid);MT.coins+=300;mtSave();UI.modal.sel=null;renderModal();render()};
function vPack(m){const shown=m.cards.slice(0,m.i);return`<h1 class="bigt">${m.i<m.cards.length?`Card ${m.i+1} of ${m.cards.length}`:'Pack opened'}</h1><div class="gut"><div class="cards" style="min-height:200px">${shown.map((c,i)=>`<div class="${i===m.i-1?'reveal':''}">${cardHTML(c,c.coach?{act:'mcoach|'+c.uid}:{})}</div>`).join('')}${m.i<m.cards.length?'<button class="pc empty" data-a="reveal">Tap to reveal</button>':''}</div>
  <div style="display:grid;gap:10px;margin:22px 0">${m.i<m.cards.length?'<button class="btn go wide" data-a="reveal">Reveal next</button><button class="btn wide" data-a="revealall">Reveal all</button>':`<button class="btn go wide" data-a="closem">Continue</button>${m.cards[0]&&m.cards[0].coach?'':'<button class="btn wide" data-a="mtautoc">Auto-fill best lines</button>'}`}</div></div>`}
A.reveal=()=>{UI.modal.i++;renderModal()};A.revealall=()=>{UI.modal.i=UI.modal.cards.length;renderModal()};A.mtautoc=()=>{mtAutoLineup();closeM();toast('Best lines set','good');render()};
function vMtRes(m){const g=m.g;const top=Object.entries(g.st).filter(([id,s])=>String(id).startsWith('c')&&s.toi&&MT.cards.some(c=>c.uid===id)).map(([id,s])=>({c:mtCard(id),s,v:(s.gl||0)*2+(s.a||0)+(s.sv||0)*.08-(s.ga||0)*.5+(s.pm||0)*.3})).sort((a,b)=>b.v-a.v).slice(0,4);
  return`<h1 class="bigt">${m.win?'Victory':m.otl?'OT loss':'Defeat'}<br>${g.sc[0]} - ${g.sc[1]}${g.how!=='REG'?`<small> (${g.how})</small>`:''}</h1><div class="gut"><p class="dim" style="text-align:center;margin-top:-26px">${esc(g.label)} · vs ${esc(g.sd[1].name)}</p>
  <div class="tiles" style="margin:18px 0">${tile('Coins',`+${m.coins.toLocaleString()}`,'y')}${tile('Shots',`${g.sog[0]}-${g.sog[1]}`)}${tile('Power play',`${g.ppg[0]}/${g.ppo[0]}`)}</div>${m.msg?`<p class="y">${esc(m.msg)}</p>`:''}
  <div class="lab" style="margin:16px 0 8px">Top performers</div><div class="cards">${top.map(x=>`<div>${cardHTML(x.c)}<div class="xs dim" style="margin-top:4px;text-align:center">${x.c.pos==='G'?`${x.s.sv||0} saves`:`${x.s.gl||0} G · ${x.s.a||0} A · ${pm(x.s.pm||0)}`}</div></div>`).join('')}</div>
  <div class="foot"><button class="btn go wide" data-a="closem">Continue</button></div></div>`}

/* ===== boot ===== */
mtLoad();render();
window.claude?.hot?.snapshot?.(()=>{try{if(L)saveNow();mtSave()}catch(e){}return{}});

})();
</script>
