<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Blueline GM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.4.4/lz-string.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap">
<style>
/* Mobile GM template: navy top bar, grey page, black panels with navy headers, green action bar, bottom tab bar. One dark look by design. */
:root{
  --page:#262626;--deep:#1b1b1b;--panel:#000;--navy:#0c2b53;--navy2:#0a2148;--th:#3b3b3b;--row:#2b2b2b;--row2:#222;--line:#3a3a3a;
  --ink:#fff;--soft:#dcdcdc;--dim:#a8a8a8;--mute:#727272;
  --green:#3a8a54;--green-ink:#c9f3d4;--ring-g:#4cad6c;--ring-y:#d4a31b;--ring-r:#b2262f;--star:#f4b400;--blue:#4a8fe0;
  --font:'Jost','Futura','Century Gothic','Avenir Next',system-ui,sans-serif;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--page);color:var(--ink);font:16px/1.35 var(--font);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--navy2);z-index:40}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ring-g);outline-offset:2px}
td,th,.num{font-variant-numeric:tabular-nums}
.app{max-width:760px;margin:0 auto;min-height:100%;position:relative;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.up{text-transform:uppercase;letter-spacing:.03em}
.dim{color:var(--dim)}.mute{color:var(--mute)}.sm{font-size:14px}.xs{font-size:12.5px}
.g{color:var(--ring-g)}.r{color:#e0525a}.y{color:var(--ring-y)}
/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--navy2);height:clamp(56px,14vw,68px);display:grid;grid-template-columns:52px minmax(0,1fr) 52px;align-items:center;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.top h1{margin:0;text-align:center;font-weight:600;font-size:clamp(20px,5.2vw,26px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.burger{width:44px;height:44px;display:grid;align-content:center;gap:7px}
.burger i{display:block;height:3px;border-radius:2px;background:#fff;width:34px}
.tback{width:44px;height:44px;display:grid;place-items:center;font-size:30px;line-height:1}
.tright{justify-self:end}
.status{display:flex;justify-content:space-between;gap:10px;padding-block:18px 16px;font-size:clamp(11.5px,3.05vw,17px);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.status span{overflow:hidden;text-overflow:ellipsis}
.status .ok{color:var(--ring-g)}.status .no{color:#e0525a}
.subtabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:0 12px}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{flex:none;height:38px;padding:0 14px;border-radius:4px;background:var(--row);color:var(--soft);font-size:14px;letter-spacing:.05em;text-transform:uppercase;display:flex;align-items:center;gap:7px}
.subtabs button.on{background:var(--navy);color:#fff}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ring-y);display:inline-block}
/* panels */
.panel{background:var(--panel);border-radius:6px;overflow:hidden;margin-bottom:14px;min-width:0}
.ph{background:var(--navy);min-height:clamp(44px,11vw,56px);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px 8px 18px}
.ph h2{margin:0;font-size:clamp(14px,3.7vw,18px);font-weight:500;letter-spacing:.04em;text-transform:uppercase;line-height:1.2}
.sq{width:clamp(28px,7vw,36px);height:clamp(28px,7vw,36px);border-radius:3px;background:#f2f2f2;color:#111;display:grid;place-items:center;font-size:18px;font-weight:500;flex:none}
.pb{padding:clamp(12px,3.4vw,16px) clamp(12px,3.6vw,18px)}
.pb.tight{padding:0}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:clamp(8px,2.6vw,14px);margin-bottom:14px}
.cols>.panel{margin-bottom:0}
@media(max-width:520px){.cols.st{grid-template-columns:1fr}}
/* tables */
.tw{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:clamp(13px,3.4vw,16px)}
.tbl th{background:var(--th);color:var(--soft);font-weight:400;text-transform:uppercase;letter-spacing:.03em;padding:clamp(10px,2.8vw,16px) clamp(5px,1.6vw,10px);text-align:center;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left;padding-left:18px}
.tbl td{padding:clamp(9px,2.6vw,14px) clamp(5px,1.6vw,10px);text-align:center;white-space:nowrap}
.tbl td.l,.tbl th.l{text-align:left}.tbl td.rt,.tbl th.rt{text-align:right;padding-right:16px}
.tbl tr.me td{font-weight:700}
.tbl tr.click{cursor:pointer}
.tbl.z tbody tr:nth-child(odd) td{background:var(--row2)}.tbl.z tbody tr:nth-child(even) td{background:var(--row)}
.twrap{padding:clamp(10px,3vw,22px) clamp(10px,3vw,22px) clamp(8px,2.4vw,18px)}
.twrap .tbl th:first-child,.twrap .tbl td:first-child{padding-left:24px}
/* rank pills */
.ranks{display:grid;grid-template-columns:1.7fr 1fr 1fr;gap:clamp(6px,2vw,12px);margin-top:4px}
.rk{display:flex;align-items:stretch;height:clamp(44px,12vw,70px);border-radius:5px;overflow:hidden;background:var(--row)}
.rk .d{width:18%;max-width:50px;min-width:12px;background:#6aa77d;display:grid;place-items:end center;padding-bottom:clamp(6px,2vw,16px);font-size:clamp(10px,2.6vw,15px)}
.rk .d.dn{background:#b55a5a}
.rk .n{width:30%;min-width:34px;background:var(--green);display:grid;place-items:center;font-size:clamp(20px,5.5vw,28px)}
.rk .l{flex:1;display:grid;place-items:center;font-size:clamp(11px,3.2vw,21px);letter-spacing:.03em;text-transform:uppercase;padding:0 6px;text-align:center}
/* rings & bars */
.ringrow{display:flex;align-items:flex-end;justify-content:center;gap:4%;padding:clamp(12px,3vw,22px) 0 6px}
.ringrow>div{flex:0 0 27%;display:grid;justify-items:center}.ringrow>div.big{flex-basis:34%}.ringrow svg{width:100%;height:auto}
.ringrow .lb{display:block;text-align:center;font-size:clamp(11px,3vw,18px);letter-spacing:.04em;margin-bottom:6px}
.bars{display:grid;gap:clamp(12px,3.4vw,22px);padding:clamp(14px,4vw,28px) 2px 8px}
.bar{display:grid;grid-template-columns:clamp(20px,5.5vw,34px) 1fr;gap:clamp(10px,3.5vw,22px);align-items:center}.bar svg{width:100%;height:auto}
.bar .t{height:clamp(6px,1.6vw,9px);border-radius:5px;background:#f2f2f2;overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:5px}
.office{display:grid;gap:22px;padding:36px 30px 24px}
.og{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:clamp(11px,3vw,18px);letter-spacing:.04em;text-transform:uppercase;line-height:1.5}
.ok-c{width:clamp(40px,11vw,78px);height:clamp(40px,11vw,78px);flex:none;border-radius:50%;display:grid;place-items:center}
.srow{display:flex;align-items:center;justify-content:space-between;font-size:clamp(11.5px,3.1vw,19px);gap:6px}
.stars{position:relative;display:inline-block;color:#454545;font-size:clamp(13px,3.9vw,26px);letter-spacing:-1px;white-space:nowrap;line-height:1}
.stars .on{position:absolute;left:0;top:0;overflow:hidden;color:var(--star);white-space:nowrap}

/* go bar */
.gobar{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:clamp(84px,24vw,118px);padding:14px 26px 14px 36px;background:var(--green);color:var(--green-ink);border-radius:4px;text-align:left;margin:4px 0}
.gobar .t{font-size:clamp(18px,4.6vw,24px);letter-spacing:.05em;text-transform:uppercase}
.gobar .o{text-align:center;font-size:clamp(20px,5vw,30px);line-height:1.2;color:var(--green-ink)}
.gobar .o small{display:block;font-size:clamp(15px,4vw,20px);letter-spacing:.1em}
.gobar .ar{width:82px;height:82px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none}
@media(max-width:420px){.gobar{padding:12px 14px 12px 18px;min-height:100px}.gobar .ar{width:62px;height:62px}}
/* bottom nav */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;max-width:760px;margin:0 auto;background:#2c2c2c;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding:8px max(6px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));border-top:1px solid #111}
.bnav button{display:flex;flex-direction:column;align-items:center;gap:3px;color:#b9b9b9;font-size:clamp(12.5px,3.4vw,16px);padding:4px 0}
.bnav button.on{color:#fff}
.bnav svg{width:clamp(34px,9vw,44px);height:clamp(30px,8vw,40px)}
.bnav .play span{width:clamp(58px,15vw,74px);height:clamp(58px,15vw,74px);border-radius:50%;border:4px solid var(--ring-g);display:grid;place-items:center}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:4px;background:#3a3a3a;color:#fff;font-size:15px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.btn.go{background:var(--green);color:var(--green-ink)}
.btn.blue{background:var(--navy);color:#fff}
.btn.red{background:#5a1d21;color:#ffc9cc}
.btn.wide{width:100%;min-height:62px;font-size:20px}
.btn.s{min-height:36px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.38;cursor:not-allowed}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{height:38px;padding:0 12px;border-radius:4px;background:var(--row);color:var(--soft);font-size:13.5px;letter-spacing:.04em;text-transform:uppercase}
.seg button.on{background:var(--green);color:var(--green-ink)}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chips button{height:34px;min-width:44px;padding:0 10px;border-radius:4px;background:var(--row);color:var(--soft);font-size:14px}
.chips button.on{background:var(--navy);color:#fff}
/* player rows */
.plist{display:grid}
.prow{display:grid;grid-template-columns:50px 56px minmax(0,1fr) auto 66px 18px;align-items:center;gap:10px;padding:8px 14px 8px 10px;background:var(--row);text-align:left;width:100%;cursor:pointer;min-height:clamp(84px,22vw,104px)}
.plist>.prow:nth-child(even){background:var(--row2)}
.prow .pp{text-align:center;font-size:clamp(13.5px,3.6vw,17px);line-height:1.6}
.prow .nm{font-size:clamp(16px,4.2vw,21px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .ar2{font-size:clamp(14px,3.6vw,18px);color:var(--soft);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .mid{text-align:center;font-size:clamp(14px,3.6vw,18px);text-transform:uppercase;line-height:1.7;white-space:nowrap}
.tag{display:inline-block;font-size:11px;letter-spacing:.06em;padding:1px 6px;border-radius:3px;background:#5a1d21;color:#ffc9cc;margin-left:6px;vertical-align:middle;text-transform:uppercase;line-height:1.5}
.tag.y{background:#4d3d0c;color:#ffe08a}.tag.b{background:#0c2b53;color:#cfe2ff}.tag.g{background:#1f4d2e;color:var(--green-ink)}
.stb{font-size:20px;color:#666;line-height:1;padding:2px 4px 2px 0;vertical-align:-2px}.stb.on{color:var(--star)}
.arrows{display:grid;gap:3px;justify-items:center;align-self:center}
.arrows i{width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:11px solid var(--ring-g)}
.arrows.y i{border-bottom-color:var(--ring-y)}
.ringwrap{position:relative;justify-self:center}
.delta{position:absolute;top:-6px;right:-22px;font-size:14px;color:var(--ring-g)}
.delta.n{color:#e0525a}
@media(max-width:470px){.prow{grid-template-columns:38px 46px minmax(0,1fr) auto 56px 14px;gap:7px;padding-right:8px;padding-left:6px}.prow .mid{font-size:13px}.prow svg[width="64"]{width:56px;height:56px}}
@media(max-width:370px){.prow{grid-template-columns:36px 42px minmax(0,1fr) 54px 14px}.prow .mid{display:none}}
/* screens (full-page modals) */
#modal:empty{display:none}
.scr{position:fixed;inset:0;z-index:70;background:#000;overflow:auto;-webkit-overflow-scrolling:touch}
.scr-in{max-width:760px;margin:0 auto;min-height:100%;padding-bottom:calc(30px + env(safe-area-inset-bottom,0px))}
.bigt{font-size:clamp(30px,8vw,44px);font-weight:700;text-align:center;text-transform:uppercase;letter-spacing:.01em;margin:0;padding:54px 16px 46px;line-height:1.05}
.foot{padding:28px 0}
.hero{display:flex;gap:16px;align-items:center;padding:20px 0 6px}
.hero h2{margin:0;font-size:28px;font-weight:600;line-height:1.1}
.attr{display:grid;grid-template-columns:minmax(0,1fr) 46px;gap:6px 12px;align-items:center;padding:9px 0;border-bottom:1px solid #1c1c1c}
.attr .n{font-size:15px;color:var(--soft)}
.attr .t{grid-column:1/-1;height:8px;border-radius:4px;background:#2a2a2a;overflow:hidden}.attr .t i{display:block;height:100%}
.attr b{text-align:right;font-weight:500}
.kv{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;margin:0}.kv dt{color:var(--dim)}.kv dd{margin:0;text-align:right}
.tabs2{display:flex;overflow-x:auto;border-bottom:1px solid #2a2a2a;margin:8px 0 14px}
.tabs2 button{padding:14px 14px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;font-size:14px;border-bottom:3px solid transparent;white-space:nowrap}
.tabs2 button.on{color:#fff;border-color:var(--ring-g)}
.fld{display:grid;gap:8px;margin-bottom:16px}
.fld label{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
input[type=text],input[type=number],select,textarea{background:#1c1c1c;border:1px solid #3a3a3a;border-radius:4px;padding:10px 12px;min-height:44px;width:100%}
textarea{min-height:110px;font:12px/1.4 ui-monospace,monospace}
input[type=range]{width:100%;accent-color:var(--ring-g)}
.meter{height:10px;border-radius:5px;background:#2a2a2a;overflow:hidden}.meter i{display:block;height:100%;border-radius:5px}
.msg{background:var(--row);border-radius:4px;padding:14px 16px;display:grid;gap:8px}
.msg+.msg{margin-top:8px}
.msg h3{margin:0;font-size:17px;font-weight:600}
.msg p{margin:0;color:var(--soft);font-size:15px}
.news .it{display:grid;grid-template-columns:70px 1fr;gap:12px;padding:14px 18px;background:var(--row);text-align:left;width:100%}
.news .it:nth-child(even){background:var(--row2)}
.news .it .m{color:var(--mute);font-size:13px;text-transform:uppercase}
.tile{background:var(--row);border-radius:4px;padding:12px 14px;min-width:0}
.tile .v{font-size:clamp(18px,5vw,26px);font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.lab{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
/* drawer */
.drawer{position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.6)}
.drawer nav{position:absolute;top:0;bottom:0;left:0;width:min(330px,86vw);background:#111;padding:calc(env(safe-area-inset-top,0px) + 20px) 0 20px;overflow:auto;display:flex;flex-direction:column}
.drawer nav .hd{padding:0 22px 18px;border-bottom:1px solid #222;margin-bottom:8px;display:flex;gap:12px;align-items:center}
.drawer nav button{text-align:left;padding:15px 22px;font-size:17px;letter-spacing:.05em;text-transform:uppercase;color:var(--soft)}
.drawer nav button:hover{background:#1c1c1c}
/* toasts */
#toasts{position:fixed;z-index:80;left:0;right:0;bottom:calc(112px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding:0 16px}
.toast{background:#f2f2f2;color:#111;padding:11px 16px;border-radius:4px;font-size:15px;max-width:520px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.toast.bad{background:#5a1d21;color:#ffd7d9}.toast.gold{background:var(--ring-y);color:#1a1300}.toast.good{background:var(--green);color:var(--green-ink)}
/* home */
.mode{background:#000;border-radius:6px;overflow:hidden;margin-bottom:14px}
.mode .pb p{margin:0 0 14px;color:var(--soft)}
.mode ul{margin:0 0 16px;padding-left:20px;color:var(--soft);display:grid;gap:4px;font-size:15px}
.saverow{display:flex;align-items:center;gap:12px;background:var(--row);border-radius:4px;padding:12px;margin-bottom:12px}
.trow{display:grid;grid-template-columns:48px minmax(0,1fr) 70px;gap:12px;align-items:center;padding:10px 14px;background:var(--row);width:100%;text-align:left}
.trow:nth-child(even){background:var(--row2)}
.trow.on{outline:2px solid var(--ring-g);outline-offset:-2px}
/* My Team cards */
.cards{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.pc{position:relative;background:var(--row);border-radius:6px;padding:12px 10px;text-align:center;display:grid;justify-items:center;gap:4px;border-top:4px solid var(--rc,#666);width:100%;min-width:0}
.pc .pn{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pc .pa{font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pc .fs{position:absolute;top:6px;right:8px;color:var(--star);font-size:18px}
.pc .lv{display:flex;gap:3px}.pc .lv i{width:12px;height:3px;background:#444;border-radius:2px}.pc .lv i.on{background:var(--star)}
.pc.bronze{--rc:#a8683c}.pc.silver{--rc:#aab4bf}.pc.gold{--rc:#d4a31b}.pc.elite{--rc:#7d5cff}.pc.legend{--rc:#ff4f86}
.pc.empty{min-height:200px;place-items:center;color:var(--mute);border:1px dashed #444}
.slotl{font-size:12px;letter-spacing:.08em;color:var(--dim);margin-bottom:4px;text-transform:uppercase}
.reveal{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}@keyframes pop{from{transform:scale(.6);opacity:0}}
.ladder{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:5px}
.ladder span{height:42px;border-radius:4px;display:grid;place-items:center;background:var(--row);color:var(--mute);font-size:16px}
.ladder span.done{background:#1f4d2e;color:var(--green-ink)}.ladder span.cur{background:var(--green);color:#fff}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.days div{background:var(--row);border-radius:4px;padding:8px 2px;text-align:center;font-size:14px;text-transform:uppercase}
.days div.on{background:var(--green);color:var(--green-ink)}.days div.past{opacity:.4}
.ap{display:flex;gap:6px}.ap i{width:18px;height:18px;border-radius:50%;border:2px solid var(--ring-g)}.ap i.on{background:var(--ring-g)}
.empty{padding:26px 18px;color:var(--dim);text-align:center}
a{color:var(--ring-g)}
@media(prefers-reduced-motion:reduce){.reveal{animation:none}}

/* ===== template screens ===== */
.toplink{justify-self:end;font-size:clamp(14px,3.8vw,18px);color:#fff;padding:8px 2px;letter-spacing:.02em}
.utabs{display:flex;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px))) 14px;padding:0 max(10px,env(safe-area-inset-left,0px));border-bottom:1px solid #3a3a3a}

function floorComply(tid){if(!capOn())return;let n=0;while(payroll(tid)<L.floor&&n<4&&contractsOf(tid).length<ORG_MAX){const gap=L.floor-payroll(tid);const fa=Object.values(L.players).filter(p=>p.tid===-1&&!p.mp&&p.ask).sort((a,b)=>b.ovr-a.ovr).find(p=>p.ask.sal<=capSpace(tid)-.5);if(!fa)break;const sal=Math.max(fa.ask.sal,Math.min(gap,fa.ask.sal*1.4));signPlayer(fa,tid,Math.round(sal*20)/20,Math.max(1,Math.min(3,fa.ask.yrs)),true);n++}
  const gap=L.floor-payroll(tid);if(gap>0){const core=rosterOf(tid).filter(p=>p.con&&!p.con.elc&&!p.mp).sort((a,b)=>b.ovr-a.ovr).slice(0,4);for(const p of core)p.con.sal=Math.round((p.con.sal+gap/core.length)*100)/100;dirty()}}
/* AI teams over the cap shed salary to the farm or waivers */
function capComply(tid){let guard=0;while(capSpace(tid)<0&&guard++<10){const ps=rosterOf(tid).filter(p=>!p.mp&&p.con&&p.con.sal>1).sort((a,b)=>(a.ovr/a.con.sal)-(b.ovr/b.con.sal));const p=ps[0];if(!p)break;if(p.con.sal>BURY+1.5)releasePlayer(p,true);else sendDown(p,true)}ensureActive(tid)}
function startRegular(){L.phase='regular';L.day=0;news('Opening night is here.',{kind:'season'});save()}
/* ---- trades ---- */
function aiTrade(){const ts=shuffle(L.teams.filter(t=>t.tid!==L.userTid)).slice(0,2);const[a,b]=ts;const pa=orgOf(a.tid).filter(p=>p.ovr>=68&&!p.mp&&p.lvl!=='JR').sort(()=>R()-.5)[0];if(!pa)return;const target=tradeValue(pa);
  const cands=orgOf(b.tid).filter(p=>!p.mp&&p.lvl!=='JR'&&Math.abs(tradeValue(p)-target)<target*.25&&p.pos!==pa.pos);const pb=pick(cands);if(!pb)return;
  const sa=pa.con?pa.con.sal:0,sb=pb.con?pb.con.sal:0;if(capSpace(a.tid)+sa-sb<0||capSpace(b.tid)+sb-sa<0)return;
  for(const p of[pa,pb])p.since=L.season;const ta=pa.tid;pa.tid=b.tid;pb.tid=ta;dirty();ensureActive(a.tid);ensureActive(b.tid);autoLines(a.tid);autoLines(b.tid);
  news(`Trade: ${a.name} send ${fullName(pa)} (${pa.pos}) to the ${b.name} for ${fullName(pb)} (${pb.pos})`,{kind:'trade'})}
function needMult(tid,p){const act=rosterOf(tid).filter(x=>grpOf(x)===grpOf(p)).sort((a,b)=>b.ovr-a.ovr);const n={F:6,D:4,G:1}[grpOf(p)];const nth=act[n-1];if(!nth)return 1.25;return p.ovr>nth.ovr+2?1.15:act.length>n+4?.85:1}
function tradeMargin(){let m={easy:-.04,normal:.07,hard:.18}[L.settings.diff]??.07;m*=L.settings.trade??1;if(L.mode==='mygm'&&hasSkill('dealmaker'))m-=.05;return m}
function evalTrade(ai,give,get){const t=T(ai);const contend=ptsPct(t)>.55||teamRanks()[ai].pw<=10;const vf=p=>tradeValue(p)*needMult(ai,p)*(contend?(p.age>=29?1.15:.9):(p.age<=24?1.2:.8));
  const vIn=sum(give.p.map(vf))+sum(give.k.map(k=>pickValue(k.season,k.rd)*(contend?.8:1.25)));const vOut=sum(get.p.map(p=>tradeValue(p)*(contend?1.05:1)))+sum(get.k.map(k=>pickValue(k.season,k.rd)));
  if(!give.p.length&&!give.k.length)return{ok:false,ratio:0,reason:'Add something from your side.'};if(give.p.length>4||get.p.length>4)return{ok:false,ratio:0,reason:'Up to four players per side.'};
  const sIn=sum(give.p.map(p=>p.con&&p.lvl==='PRO'?p.con.sal:0)),sOut=sum(get.p.map(p=>p.con&&p.lvl==='PRO'?p.con.sal:0));const slack=isOffseason(L)||L.phase==='preseason'?L.cap*.1:0;
  if(capSpace(ai)+slack+sOut-sIn<0)return{ok:false,ratio:0,reason:`${t.abbr} can't fit that under the cap (${money(capSpace(ai))} of space).`};
  if(capOn()&&capSpace(L.userTid)+slack+sIn-sOut<0)return{ok:false,ratio:0,reason:`That puts you over the cap by ${money(-(capSpace(L.userTid)+sIn-sOut))}.`};
  if(contractsOf(ai).length+get.p.length*0+give.p.length-get.p.length>ORG_MAX)return{ok:false,ratio:0,reason:`${t.abbr} are at the ${ORG_MAX}-contract limit.`};
  const ratio=vOut?vIn/vOut:2;const need=1+tradeMargin();
  return{ok:ratio>=need,ratio:ratio/need,reason:ratio>=need?'They would accept':ratio>=need*.85?"Close. They'd want a little more.":"Not enough value for them.",contend}}
function counterOffer(ai,give,get){const ev=evalTrade(ai,give,get);if(ev.ok)return null;const pool=orgOf(L.userTid).filter(p=>!give.p.includes(p)&&!p.mp).sort((a,b)=>tradeValue(a)-tradeValue(b));
  for(const p of pool){const g2={p:give.p.concat(p),k:give.k};if(g2.p.length>4)break;if(evalTrade(ai,g2,get).ok)return{add:p}}const pk=L.picks.filter(k=>k.tid===L.userTid&&!give.k.includes(k)).sort((a,b)=>pickValue(a.season,a.rd)-pickValue(b.season,b.rd));for(const k of pk){if(evalTrade(ai,{p:give.p,k:give.k.concat(k)},get).ok)return{addK:k}}return null}
function doTrade(ai,give,get){for(const p of give.p.concat(get.p))p.since=L.season;for(const p of give.p){p.tid=ai;T(L.userTid).block=T(L.userTid).block.filter(id=>id!==p.id)}for(const p of get.p){p.tid=L.userTid}for(const k of give.k)k.tid=ai;for(const k of get.k)k.tid=L.userTid;dirty();
  ensureActive(ai);autoLines(ai);ensureActive(L.userTid);fixLines(L.userTid);news(`Trade: you sent ${give.p.map(fullName).concat(give.k.map(k=>`${k.season} R${k.rd} pick`)).join(', ')} to the ${T(ai).name} for ${get.p.map(fullName).concat(get.k.map(k=>`${k.season} R${k.rd} pick`)).join(', ')||'nothing'}`,{tid:L.userTid,kind:'trade'});achCheck('trade',{});save()}
function tradeFinder(p){const out=[];const target=tradeValue(p);
  for(const t of L.teams){if(t.tid===L.userTid)continue;const ps=orgOf(t.tid).filter(x=>tradeValue(x)<=target*1.05&&!x.mp).sort((a,b)=>tradeValue(b)-tradeValue(a));const get={p:[],k:[]};let v=0;
    for(const x of ps){if(get.p.length>=3)break;if(v+tradeValue(x)<=target*.98){get.p.push(x);v+=tradeValue(x)}}
    if(v<target*.6){for(const k of L.picks.filter(k=>k.tid===t.tid).sort((a,b)=>pickValue(b.season,b.rd)-pickValue(a.season,a.rd))){if(v+pickValue(k.season,k.rd)<=target){get.k.push(k);v+=pickValue(k.season,k.rd)}if(get.k.length>=2)break}}
    if(v<target*.75||(!get.p.length&&!get.k.length))continue;const ev=evalTrade(t.tid,{p:[p],k:[]},get);if(ev.ok)out.push({tid:t.tid,get,v})}
  return out.sort((a,b)=>b.v-a.v).slice(0,8)}
function genOffers(n){const ut=UT();for(let k=0;k<n;k++){const pid=pick(ut.block);const p=P(pid);if(!p||p.tid!==L.userTid)continue;const f=tradeFinder(p);if(!f.length)continue;const o=pick(f.slice(0,3));
  L.offers=L.offers||[];if(L.offers.some(x=>x.give.p.includes(pid)&&x.from===o.tid))continue;L.offers.push({id:'o'+Date.now()%1e7+k,from:o.tid,give:{p:[pid],k:[]},get:{p:o.get.p.map(x=>x.id),k:o.get.k.map(x=>({season:x.season,rd:x.rd,orig:x.orig}))}});if(L.offers.length>6)L.offers.shift()}}

const facCost=lv=>8*lv;const facWeeks=lv=>3+lv*2;
function fairPrice(t){return Math.round(52+t.market*11+t.hype*.25+t.fac.lux*2+t.arena.qual*.06+ptsPct(t)*24)}
function attendance(t,opp){const g=gpOf(t);const base=clamp(.55+t.hype*.003+t.pop*.0022+(g>8?(ptsPct(t)-.5)*.55:0)+(t.fac.fan-1)*.03+(opp?opp.pop*.0006:0)+(t.arena.qual-60)*.001,.3,1.08);
  const ratio=t.price.tix/fairPrice(t);const pf=clamp(1.45-.45*Math.pow(ratio,1.5),.3,1.1);return Math.round(Math.min(t.arena.cap,t.arena.cap*base*pf*rnd(.95,1.05)))}
function sentiment(t){const r=t.price.tix/fairPrice(t),c=t.price.conc,pk=t.price.park/(15+t.market*4),m=t.price.merch;return clamp(1.6-(r*.5+c*.2+pk*.1+m*.2),0,1)}
function financeGame(h,a,po){const att=attendance(h,a);h.attend.push({s:L.season,d:L.day,att,cap:h.arena.cap,po});const f=h.fin;const pm=po?1.7:1;
  f.tix+=att*h.price.tix*pm/1e6;f.conc+=att*16*h.price.conc*clamp(1.45-.45*h.price.conc,.4,1.15)/1e6;const fp=15+h.market*4;f.park+=att*.3*h.price.park*clamp(1.35-.35*(h.price.park/fp),.3,1.1)/1e6;
  const star=sum(rosterOf(h.tid).map(p=>p.pop).sort((x,y)=>y-x).slice(0,3));f.merch+=(att*6*h.price.merch*clamp(1.45-.45*h.price.merch,.4,1.1)+h.pop*1200+star*600)*(L.mode==='mygm'&&h.tid===L.userTid&&hasSkill('merch')?1.15:1)/1e6;
  f.lux+=h.fac.lux*.12*pm;if(po)f.po+=.6}
function weeklyFinance(){if(L.phase!=='regular')return;const fr=7/Math.max(1,L.sched.length);
  for(const t of L.teams){const f=t.fin;const before=revTotal(t)-expTotal(t);f.tv+=(40+t.market*9)*fr;f.spons+=(14+t.market*5+t.pop*.08)*fr+(t.tid===L.userTid&&L.gm?sum(L.gm.sponsors.map(s=>s.amt))*fr:0);
    const pay=payroll(t.tid);f.pay+=pay*fr;f.staff+=staffCost(t)*fr;f.ops+=(sum(Object.values(t.fac))*1.6+t.arena.cap/700+30)*fr;
    if(t.tid===L.userTid&&L.mode==='mygm'){const b=L.gm.budget;f.mkt+=(b.coach+b.med+b.scout+b.mkt)/100*3*fr;t.hype=clamp(t.hype+(b.mkt-50)/160,0,100)}
    t.cash=Math.round((t.cash+(revTotal(t)-expTotal(t))-before)*10)/10;(t.build||[]).forEach(b=>b.wk--);for(const b of(t.build||[]).filter(b=>b.wk<=0)){t.fac[b.k]=Math.min(5,t.fac[b.k]+1);if(t.tid===L.userTid)news(`Construction finished: ${FAC_NAME[b.k]} is now level ${t.fac[b.k]}`,{tid:t.tid,kind:'biz'})}t.build=(t.build||[]).filter(b=>b.wk>0)}}

function resolveInbox(id,a){const G=L.gm,t=UT();const it=G.inbox.find(x=>x.id===id);if(!it)return;let msg='';const p=it.pid?P(it.pid):null;

function useAP(n=1){if(L.mode!=='mygm')return true;if(L.gm.ap<n){toast('No action points left this week.','bad');return false}L.gm.ap-=n;gmXP(4);return true}

const STK=['gp','gl','a','pm','sog','att','blk','hit','pim','ppg','ppa','shg','gwg','fow','fol','toi','pptoi','shtoi','tk','gv','shf','fight','gs','sa','ga','sv','w','l','otl','so','star1','star2','star3','sog_so','som','sow1'];
const INTK=new Set(['morale','pop','fat','xp','rel','hype','d']);
function packSt(o){const a=STK.map(k=>o[k]||0);while(a.length&&!a[a.length-1])a.pop();return a}
function unpackSt(a){const o={};a.forEach((v,i)=>{if(v)o[STK[i]]=v});return o}
const RPL=(k,v)=>{if(k[0]==='_')return undefined;if(typeof v==='number')return Number.isInteger(v)?v:INTK.has(k)?Math.round(v):Math.round(v*100)/100;
  if((k==='st'||k==='ps')&&v&&typeof v==='object'&&!Array.isArray(v)){const o={};for(const s in v)o[s]=Array.isArray(v[s])?v[s]:packSt(v[s]);return o}

function lineChem(cs,posFor,boost){return cs.map((c,i)=>{if(!c)return 0;const pos=posFor(i);const ok=pos==='D'?c.pos==='D':c.pos!=='D'&&c.pos!=='G'&&(c.pos===pos||(c.sec||[]).includes(pos)||(pos!=='C'&&c.pos!=='C'));if(!ok)return 0;

TABS.owner=()=>{const G=L.gm,t=UT();return panel(esc(t.owner.name),`<dl class="kv"><dt>Style</dt><dd>${t.owner.style}</dd><dt>Relationship</dt><dd>${Math.round(G.ownerRel)}/100</dd><dt>Budget ceiling</dt><dd>${Math.round(G.budgetMax)} pts</dd><dt>Team cash</dt><dd>${money(t.cash)}</dd><dt>Seasons in charge</dt><dd>${G.seasons+1}</dd></dl>
  <div class="lab" style="margin:18px 0 8px">Job security · ${Math.round(G.job)}/100</div>${meter(G.job/100,G.job<35?'var(--ring-r)':G.job<55?'var(--ring-y)':'var(--ring-g)')}<p class="sm dim">Below 22 at season's end and you're out.</p><button class="btn" data-a="biz|owner">Request a meeting (1 AP)</button>`)

TABS.business=()=>{const t=UT(),G=L.gm;const fair=fairPrice(t);const att=attendance(t,null);const sent=sentiment(t);const pi=hasSkill('pricing');const used=sum(Object.values(G.budget));
  const sl=(k,l,min,max,step,val,f)=>`<div class="fld"><label for="pr-${k}">${l}: <b id="pv-${k}" style="color:#fff">${f(val)}</b></label><input id="pr-${k}" type="range" min="${min}" max="${max}" step="${step}" value="${val}" data-live="price|${k}" data-in="pricec|${k}"></div>`;

   <div class="tiles">${tile('Projected crowd',`<span id="pv-att">${pct(att/t.arena.cap)}</span>`)}${tile('Fan mood',pi?pct(sent):sent>.66?'Happy':sent>.4?'Mixed':'Angry')}</div><p class="sm dim" style="margin-bottom:0">${pi?`Fans will pay about ${dollars(fair)} a ticket.`:'Unlock Pricing insight for exact numbers.'}</p>`)
  +panel('Sponsorships',`${['Jersey patch','Arena naming','Helmet decal'].map(s=>{const x=G.sponsors.find(y=>y.slot===s);return rowLine(`<div><div>${s}</div><div class="sm dim">${x?`${esc(x.name)} · ${x.yrs} left`:'Open'}</div></div>`,`<b>${x?money(x.amt)+'/yr':'—'}</b>`)}).join('')}<div class="acts" style="margin-top:14px"><button class="btn s" data-a="biz|sponsor">Call sponsors (1 AP)</button><button class="btn s" data-a="biz|market">Marketing ($1.5M)</button></div>`)
  +panel(`Budgets · ${used}/${Math.round(G.budgetMax)}`,[['coach','Coaching','Game-night edge'],['med','Medical','Fewer injuries'],['scout','Scouting','More scouting points'],['mkt','Marketing','Hype grows weekly']].map(([k,l,d])=>`<div class="fld"><label for="bd-${k}">${l}: <b style="color:#fff">${G.budget[k]}</b> · ${d}</label><input id="bd-${k}" type="range" min="0" max="100" step="5" value="${G.budget[k]}" data-in="budget|${k}"></div>`).join(''))

A.unlock=id=>{const G=L.gm;if(G.pts<1||G.skills[id])return;G.pts--;G.skills[id]=1;if(id==='workaholic')G.ap++;toast('Skill unlocked','gold');save();render()};

function pnl(t){const f=t.fin;const r=[['Tickets',f.tix],['Concessions',f.conc],['Parking',f.park],['Merchandise',f.merch],['Luxury suites',f.lux],['TV & media',f.tv],['Sponsors',f.spons],['Playoff revenue',f.po||0]],e=[['Payroll',f.pay],['Staff',f.staff],['Operations & farm',f.ops],['Budgets',f.mkt]];const rv=revTotal(t),ex=expTotal(t);
  return`<div class="tw"><table class="tbl z"><tbody>${r.map(([l,v])=>`<tr><td>${l}</td><td class="rt">${money(v,1)}</td></tr>`).join('')}<tr><td><b>Revenue</b></td><td class="rt"><b>${money(rv,1)}</b></td></tr>${e.map(([l,v])=>`<tr><td>${l}</td><td class="rt">−${money(v,1)}</td></tr>`).join('')}<tr><td><b>Profit</b></td><td class="rt"><b class="${rv-ex>=0?'g':'r'}">${money(rv-ex,1)}</b></td></tr></tbody></table></div>`}
TABS.finance=()=>{const t=UT();const att=t.attend.filter(a=>a.s===L.season);return panel(`${seasonLbl(L.season)} finances`,pnl(t),{raw:true})
  +panel('Gate',`${L.mode==='mygm'?'<p class="dim" style="margin-top:0">Set prices on the Business screen.</p>':`<div class="fld"><label for="pr-tix">Ticket price: <b id="pv-tix" style="color:#fff">${dollars(t.price.tix)}</b></label><input id="pr-tix" type="range" min="25" max="260" value="${t.price.tix}" data-live="price|tix" data-in="pricec|tix"></div>`}
   <div class="tiles">${tile('Projected crowd',`<span id="pv-att">${pct(attendance(t,null)/t.arena.cap)}</span>`)}${tile('Capacity',t.arena.cap.toLocaleString())}${tile('Owner cash',money(t.cash))}</div>
   ${att.length?`<div class="lab" style="margin:16px 0 8px">Home crowds</div><div style="display:flex;gap:4px;align-items:flex-end;height:64px">${att.map(a=>`<div title="${a.att.toLocaleString()}" style="flex:1;max-width:30px;height:${Math.max(6,a.att/a.cap*100)}%;background:${barC(a.att/a.cap)};border-radius:3px 3px 0 0"></div>`).join('')}</div>`:''}`)
  +(t.finHist.length?panel('Past seasons',`<div class="tw"><table class="tbl z"><thead><tr><th>Season</th><th>Revenue</th><th>Profit</th><th>Crowd</th></tr></thead><tbody>${t.finHist.slice().reverse().map(h=>`<tr><td>${seasonSh(h.s)}</td><td>${money(h.rev)}</td><td class="${h.profit>=0?'g':'r'}">${money(h.profit)}</td><td>${pct(h.att)}</td></tr>`).join('')}</tbody></table></div>`,{raw:true}):'')};
TABS.trophy=()=>{const a=L.ach||{};return panel('Trophies',`<div class="plist">${ACH.map(x=>`<div class="trow" style="grid-template-columns:44px minmax(0,1fr) auto"><svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><path d="M9 4h16v8c0 5-3.6 8.5-8 8.5S9 17 9 12z M9 7H4c0 5 2.5 7.5 5 7.5 M25 7h5c0 5-2.5 7.5-5 7.5 M17 20.5V26 M11 30h12 M13 26h8v4h-8z" fill="${a[x.id]?'var(--star)':'#3a3a3a'}" stroke="${a[x.id]?'var(--star)':'#3a3a3a'}" stroke-width="1.6"/></svg><div style="min-width:0"><div>${x.n}</div><div class="sm dim">${x.d}</div></div>${a[x.id]?`<span class="tag g">${seasonSh(a[x.id])}</span>`:''}</div>`).join('')}</div>`,{raw:true})+awardPanels()};
/* ---- front office ---- */
const FO_TABS=[['overview','Overview'],['coaches','Coaches'],['scouts','Scouts'],['physios','Medical'],['board','Board'],['fin','Finances'],['fac','Facilities'],['trophy','Trophies']];
const GRP_INFO={coach:{t:'Coaches',k:'coaches',a:'Player Development',b:'Game Prep',fx:'Player Development speeds up growth on the pro roster, the farm and in juniors. Game Prep adds an edge to every shift. Your goalie coach sharpens your goaltenders.'},
  scout:{t:'Scouts',k:'scouts',a:'Evaluator',b:'Star Spotter',fx:'Evaluator narrows draft prospect rating ranges. Star Spotter makes potential projections more accurate. Both add weekly scouting points.'},
  phys:{t:'Medical',k:'physios',a:'Prevention',b:'Rehabilitation',fx:'Prevention lowers the chance of injuries. Rehabilitation gets injured players back sooner.'}};
function jobSec(t){if(L.mode==='mygm'&&L.gm)return Math.round(L.gm.job);const st=goalStatus(t).s;let v=62+(t.rec.w+t.rec.l?(winPct(t)-.5)*50:0)+({met:18,track:8,risk:-12,fail:-24}[st]||0);for(const x of t.hist.slice(-2))v+=(x.pct-.5)*20;return clamp(Math.round(v),0,100)}
const jobLbl=v=>v>=75?['Secure','g']:v>=50?['Stable','g']:v>=35?['Under pressure','y']:['Hot seat','r'];
const GOAL_ST={met:'Achieved',track:'On track',risk:'At risk',fail:'Missed',pending:'Pending'};
TABS.front=()=>{const t=UT();const fr=franchiseRec(t);const tab=UI.foTab||'overview';
  const head=`<div class="fohead"><div class="tc">${teamCirc(t)}<span class="rec">${recStr(t)}</span></div><div class="fr"><div><span>Franchise record</span><b>${fr.rec}</b></div><div><span>Playoffs</span><b>${fr.po}</b></div></div><button class="tro" data-a="fot|trophy" aria-label="Trophies">${ICON.trophy}<b>×${fr.titles}</b></button></div>`;
  const body={overview:foOverview,coaches:()=>foGroup('coach'),scouts:()=>foGroup('scout'),physios:()=>foGroup('phys'),board:foBoard,fin:TABS.finance,fac:foFac,trophy:TABS.trophy}[tab]||foOverview;
  return head+utabs(FO_TABS,tab,'fot')+body()};
A.fot=k=>{if(UI.tab!=='front'){UI.foTab=k;go('front');return}UI.foTab=k;render()};
function foOverview(){const t=UT();const filled=STAFF_ROLES.filter(r=>t.staff[r]).length;const st=L.mode==='mygm'?(()=>{const d=L.gm.dirs.find(x=>x.primary)||L.gm.dirs[0];return d&&dirProgress(d).met?'track':'risk'})():goalStatus(t).s;const js=jobSec(t);const[jl,jc]=jobLbl(js);
  return`<div class="fo3"><div>${ICON.people}<b>${filled}/${STAFF_ROLES.length}</b><span>Roles filled</span></div><div>${ICON.target}<b class="${st==='risk'?'y':st==='fail'?'r':'g'}">${GOAL_ST[st]||'—'}</b><span>(${esc(goalShort(t))})</span></div><div>${ICON.dollar}<b>${money(t.cash)}</b><span>Owner cash</span></div></div>
  <div class="jsbar ${jc}" role="status">Job security: ${jl}</div>
  ${['coach','scout','phys'].map(g=>{const I=GRP_INFO[g];const vac=STAFF_GRP[g].filter(r=>!t.staff[r]).length;const cost=sum(STAFF_GRP[g].map(r=>t.staff[r]?t.staff[r].sal:0));
    return panel(I.t,`<div class="vc"><span>Vacancies: <b class="${vac?'r':''}">${vac}</b></span><span>Cost: <b>${money(cost)}</b></span></div><div class="srow"><span>${I.a}</span>${stars(grpR(t,g,'a'))}</div><div class="srow"><span>${I.b}</span>${stars(grpR(t,g,'b'))}</div>`,{btn:sqBtn('fot|'+I.k,'∞',I.t)})}).join('')}`}
function foGroup(g){const t=UT();const I=GRP_INFO[g];const tot=staffCost(t);
  return`<p class="sm dim" style="margin:0 0 12px">${I.fx}${L.settings.scap!==false?` Staff payroll ${money(tot)} of a ${money(STAFF_CAP)} staff cap.`:''}</p>`+STAFF_GRP[g].map(r=>{const s=t.staff[r];
    if(!s)return panel(ROLE_NAME[r],`<p class="dim" style="margin-top:0">Vacant. This role counts as very low until you fill it.</p><button class="btn go" data-a="hire|${r}">Hire</button>`);
    return panel(ROLE_NAME[r],`<div class="stf">${avatar(hseed(s.id),64,t.c1,t.c2)}<div style="min-width:0"><div class="nm">${esc(s.name)}</div><div class="sm dim">Age ${s.age} · ${esc(s.trait)}</div><div class="sm dim">${money(s.sal)} × ${Math.max(0,s.yrs)} yr</div></div></div>
     <div class="srow"><span>${I.a}</span>${stars(s.a)}</div><div class="srow"><span>${I.b}</span>${stars(s.b)}</div>
     <div class="acts" style="margin-top:12px"><button class="btn s" data-a="hire|${r}">Replace</button><button class="btn s" data-a="sext|${r}">Extend 2 yrs</button><button class="btn s red" data-a="srel|${r}">Release</button></div>`)}).join('')}
function foBoard(){const t=UT();if(L.mode==='mygm')return TABS.owner();const js=jobSec(t);const[jl,jc]=jobLbl(js);const st=goalStatus(t).s;
  return panel(esc(t.owner.name),`<dl class="kv"><dt>Owner style</dt><dd>${t.owner.style}</dd><dt>Season goal</dt><dd>${esc(t.goal?t.goal.text:'—')}</dd><dt>Status</dt><dd class="${st==='risk'?'y':st==='fail'?'r':'g'}">${GOAL_ST[st]}</dd><dt>Owner cash</dt><dd>${money(t.cash)}</dd><dt>Hype</dt><dd>${Math.round(t.hype)}</dd><dt>Fan base</dt><dd>${Math.round(t.pop)}</dd></dl>
   <div class="lab" style="margin:18px 0 8px">Job security · ${jl}</div>${meter(js/100,jc==='r'?'var(--ring-r)':jc==='y'?'var(--ring-y)':'var(--ring-g)')}<p class="sm dim" style="margin-bottom:0">Franchise mode won't fire you, but the owner is keeping score.</p><dl class="kv" style="margin-top:14px"><dt>Salary cap</dt><dd>${money(L.cap)}</dd><dt>Cap floor</dt><dd>${money(L.floor)}</dd><dt>Cap hit</dt><dd>${money(payroll(t.tid))}</dd><dt>Cap space</dt><dd class="${capSpace(t.tid)<0?'r':''}">${money(capSpace(t.tid))}</dd></dl>`)
  +panel('Seasons',t.hist.length?`<div class="tw"><table class="tbl z"><thead><tr><th>Season</th><th>Record</th><th>Pts</th><th class="l">Result</th></tr></thead><tbody>${t.hist.slice().reverse().map(h=>`<tr><td>${seasonSh(h.s)}</td><td>${h.w}-${h.l}-${h.otl}</td><td>${h.pts}</td><td class="l">${esc(h.res)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">First review after the ${CUP}.</div>`,{raw:true})}
function foFac(){const t=UT();return panel('Facilities',`${Object.keys(FAC_NAME).map(k=>{const lv=t.fac[k];const b=(t.build||[]).find(x=>x.k===k);return rowLine(`<div style="min-width:0"><div>${FAC_NAME[k]} <span class="y">${'■'.repeat(lv)}</span><span class="mute">${'■'.repeat(5-lv)}</span></div><div class="sm dim">${FAC_DESC[k]}</div></div>`,b?`<span class="tag b">${b.wk} wk</span>`:lv>=5?'<span class="tag g">Max</span>':`<button class="btn s" data-a="fac|${k}" ${t.cash<facCost(lv)?'disabled':''}>${money(facCost(lv))}</button>`)}).join('')}<p class="sm dim" style="margin-bottom:0">Owner cash: ${money(t.cash)}</p>`)}
A.hire=r=>openM({type:'hire',role:r});
A.srel=r=>{const s=UT().staff[r];if(!s)return;const dead=Math.round(s.sal*Math.max(0,s.yrs)*.5*10)/10;openM({type:'confirm',text:`Release ${ROLE_NAME[r].toLowerCase()} ${s.name}? The buyout is ${money(dead)} from owner cash and the role stays vacant until you hire.`,ok:'Release',act:'dosrel|'+r,danger:true})};
A.dosrel=r=>{const t=UT();const s=t.staff[r];if(!s)return;const dead=Math.round(s.sal*Math.max(0,s.yrs)*.5*10)/10;t.cash-=dead;t.staff[r]=null;news(`Released ${ROLE_NAME[r].toLowerCase()} ${s.name}`,{tid:t.tid,kind:'staff'});closeM();save();render()};
A.sext=r=>{const t=UT();const s=t.staff[r];if(!s)return;const ns=Math.round(s.sal*1.08*10)/10;if(L.settings.scap!==false&&staffCost(t)-s.sal+ns>STAFF_CAP){toast('That would put you over the staff cap.','bad');return}s.sal=ns;s.yrs=Math.max(0,s.yrs)+2;toast(`${s.name} extended: ${money(ns)} × ${s.yrs}`,'good');save();render()};
function vHire(m){const t=UT();const r=m.role;const cur=t.staff[r];const I=GRP_INFO[roleGrp(r)];const pool=L.staffPool.filter(s=>s.role===poolRole(r));const dead=cur?Math.round(cur.sal*Math.max(0,cur.yrs)*.5*10)/10:0;const room=STAFF_CAP-staffCost(t)+(cur?cur.sal:0);const capOn=L.settings.scap!==false;
  return`${scrTop(cur?'Replace':'Hire')}<div class="gut"><p class="dim" style="margin:20px 0">${ROLE_NAME[r]}. ${cur?`Current: ${esc(cur.name)}. Buyout ${money(dead)} from owner cash.`:'This role is vacant.'}${capOn?` Staff cap room: ${money(room)}.`:''}</p></div>
  <div class="plist">${pool.map(s=>`<div class="trow hire">${avatar(hseed(s.id),48,'#3a3a3a','#bbbbbb')}<div style="min-width:0"><div>${esc(s.name)}</div><div class="sm dim">${esc(s.trait)} · age ${s.age} · ${money(s.sal)} × ${s.yrs}</div><div class="srow xs"><span>${I.a}</span>${stars(s.a)}</div><div class="srow xs"><span>${I.b}</span>${stars(s.b)}</div></div><button class="btn go s" data-a="dohire|${s.id}|${r}" ${capOn&&s.sal>room?'disabled':''}>Hire</button></div>`).join('')||'<div class="empty">Nobody available right now. The pool refreshes each offseason.</div>'}</div>`}

  return panel('Top 10 prospects',`<div class="plist">${top.map((p,i)=>prow(p,{act:'pl|'+p.id,sub:`#${i+1} · ${esc(potProj(p.pot,p.pos))} ${t.focus.includes(p.id)?'<span class="tag g">Focus</span>':''}`,mid:`${p.lvl==='PRO'?'PRO':p.lvl==='FARM'?'FARM':'JR'} · AGE ${p.age}<br>POT ${potGrade(p.pot)}`})).join('')||'<div class="empty">No prospects.</div>'}</div>`,{raw:true})
  +panel(`Development focus · ${t.focus.length}/3`,`<p class="sm dim" style="margin-top:0">Focus players get 60% more development every week. Tap to add or remove.</p></div><div class="plist">${pros.slice(0,16).map(p=>prow(p,{act:'focus|'+p.id,star:false,sub:`${esc(archetype(p))} ${t.focus.includes(p.id)?'<span class="tag g">Focus</span>':''}`,mid:`${p.lvl}<br>POT ${potGrade(p.pot)}`})).join('')}</div><div class="pb">`)
  +(rep.length?panel('Last offseason',`<div class="plist">${rep.map(x=>prow(x.p,{delta:x.d,star:false})).join('')}</div>`,{raw:true}):'')};
A.focus=id=>{const t=UT();id=+id;t.focus=t.focus||[];if(t.focus.includes(id))t.focus=t.focus.filter(x=>x!==id);else if(t.focus.length<3)t.focus.push(id);else toast('Three players max.','bad');save();render()};
/* ---- history ---- */
function franchiseRec(t){let w=0,l=0,o=0;for(const h of t.hist){w+=h.w;l+=h.l;o+=h.otl||0}const cur=!t.hist.length||t.hist[t.hist.length-1].s!==L.season;if(cur){w+=t.rec.w;l+=t.rec.l;o+=t.rec.otl}
  const po=t.hist.filter(h=>h.res&&h.res!=='Missed playoffs'&&h.res!=='—').length;return{rec:`${w}-${l}-${o}`,po:t.hist.length?Math.round(po/t.hist.length*100)+'%':'—',titles:t.hist.filter(h=>h.res===`Won the ${CUP}`).length}}
TABS.thist=()=>{const t=UT();const fr=franchiseRec(t);const hof=L.hof.filter(x=>String(x.teams).split(', ').includes(t.abbr));const pool=Object.values(L.players).filter(p=>(p.hist||[]).some(h=>h.tid===t.tid)||p.tid===t.tid);
  const lead=(k,l,f)=>{const a=pool.map(p=>{const c=careerTotals(p);return{p,v:f?f(c):c[k]||0}}).filter(x=>x.v>0).sort((a,b)=>b.v-a.v)[0];return a?`<dt>${l}</dt><dd>${esc(fullName(a.p))} · ${Math.round(a.v).toLocaleString()}</dd>`:''};
  return panel(esc(teamName(t)),`<div class="tiles">${tile('Franchise record',fr.rec)}${tile('Playoffs',fr.po)}${tile('Titles',fr.titles)}</div><dl class="kv" style="margin-top:16px">${lead('gl','Goals')}${lead('a','Assists')}${lead('pts','Points',c=>PTS(c))}${lead('w','Goalie wins')}${lead('so','Shutouts')}${lead('pim','Penalty minutes')}</dl>`)
  +panel('Seasons',t.hist.length?`<div class="tw"><table class="tbl z"><thead><tr><th>Season</th><th>W</th><th>L</th><th>OTL</th><th>PTS</th><th>GF</th><th>GA</th><th class="l">Result</th></tr></thead><tbody>${t.hist.slice().reverse().map(x=>`<tr><td>${seasonSh(x.s)}</td><td>${x.w}</td><td>${x.l}</td><td>${x.otl}</td><td>${x.pts}</td><td>${x.gf}</td><td>${x.ga}</td><td class="l">${esc(x.res)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Finish a season to start your history.</div>',{raw:true})
  +(hof.length?panel('Hall of Famers',`<div class="tw"><table class="tbl z"><tbody>${hof.map(x=>`<tr><td>${x.s}</td><td class="l">${esc(x.name)}</td><td>${x.pos}</td></tr>`).join('')}</tbody></table></div>`,{raw:true}):'')};
/* ---- trades ---- */
function tradeItems(tid,side){const sel=UI.tsel[side];const ps=orgOf(tid).filter(p=>!p.mp||tid!==L.userTid).sort((a,b)=>tradeValue(b)-tradeValue(a));const pks=L.picks.filter(k=>k.tid===tid).sort((a,b)=>a.season-b.season||a.rd-b.rd);
  return`<div class="tw" style="max-height:420px;overflow:auto"><table class="tbl z"><tbody>${ps.map(p=>`<tr class="click ${sel.p.includes(p.id)?'me':''}" data-a="tsel|${side}|p|${p.id}"><td style="width:30px"><input type="checkbox" tabindex="-1" ${sel.p.includes(p.id)?'checked':''} aria-label="Select"></td><td>${p.pos}</td><td class="l">${esc(initials(p))}${p.lvl!=='PRO'?` <span class="dim">${p.lvl==='FARM'?'Farm':'Jr'}</span>`:''}</td><td>${ovrB(p.ovr)}</td><td class="dim">${p.age<=23?potGrade(p.pot):''}</td><td class="rt dim">${p.con?money(p.con.sal):'—'}</td></tr>`).join('')}
  ${pks.map(k=>`<tr class="click ${sel.k.includes(k)?'me':''}" data-a="tsel|${side}|k|${L.picks.indexOf(k)}"><td><input type="checkbox" tabindex="-1" ${sel.k.includes(k)?'checked':''} aria-label="Select"></td><td>Pick</td><td class="l">${k.season} R${k.rd}</td><td colspan="3" class="rt dim">${k.orig!==tid?'via '+T(k.orig).abbr:''}</td></tr>`).join('')}</tbody></table></div>`}
TABS.trades=()=>{const tid=UI.tradeTid??L.teams.find(t=>t.tid!==L.userTid).tid;UI.tradeTid=tid;const ot=T(tid);const S=UI.tsel;const give={p:S.give.p.map(P).filter(Boolean),k:S.give.k},get={p:S.get.p.map(P).filter(Boolean),k:S.get.k};
  const ev=evalTrade(tid,give,get);const r=clamp(ev.ratio,0,1.3);const open=tradeOpen();const ctr=!ev.ok&&(give.p.length||give.k.length)&&ev.ratio>0?counterOffer(tid,give,get):null;
  const offers=(L.offers||[]).map(o=>{const f=T(o.from);const gp=o.give.p.map(P).filter(Boolean),gt=o.get.p.map(P).filter(Boolean);const gk=o.get.k.map(k=>L.picks.find(x=>x.season===k.season&&x.rd===k.rd&&x.orig===k.orig)).filter(Boolean);
    return`<div class="msg"><h3>${esc(teamName(f))}</h3><p>Want ${gp.map(fullName).join(', ')} · offer ${gt.map(p=>`${fullName(p)} (${p.pos} ${p.ovr})`).concat(gk.map(k=>`${k.season} R${k.rd}`)).join(', ')||'nothing'}</p><div class="acts"><button class="btn s go" data-a="offer|${o.id}|yes">Accept</button><button class="btn s" data-a="offer|${o.id}|no">Decline</button></div></div>`}).join('');
  const dIn=sum(get.p.map(p=>p.con&&p.lvl==='PRO'?p.con.sal:0))-sum(give.p.map(p=>p.con&&p.lvl==='PRO'?p.con.sal:0));
  return`${offers?panel('Offers for you',offers):''}
  ${panel('Build a trade',`<div class="fld"><label for="ttid">Trade partner</label><select id="ttid" data-in="ttid">${L.teams.filter(t=>t.tid!==L.userTid).map(t=>`<option value="${t.tid}" ${t.tid===tid?'selected':''}>${esc(teamName(t))} (${recStr(t)})</option>`).join('')}</select></div>
   <p class="sm dim" style="margin:0 0 10px">${ev.contend?`${esc(ot.abbr)} are contending: they want proven players now.`:`${esc(ot.abbr)} are rebuilding: they want young talent and picks.`} Their cap space: ${money(capSpace(tid))}. Yours after this deal: ${money(capSpace(L.userTid)-dIn)}. Up to four players a side.</p>
   <div class="lab" style="margin-bottom:6px">You send</div></div>${tradeItems(L.userTid,'give')}<div class="pb"><div class="lab">${esc(ot.abbr)} send</div></div>${tradeItems(tid,'get')}<div class="pb">
   <div style="display:flex;justify-content:space-between;gap:10px" class="sm"><span class="dim up">${esc(ot.abbr)} interest</span><span class="${ev.ok?'g':'dim'}">${esc(ev.reason)}</span></div><div style="margin-top:8px">${meter(r/1.3,ev.ok?'var(--ring-g)':r>.8?'var(--ring-y)':'var(--ring-r)')}</div>
   ${ctr?`<div class="msg" style="margin-top:12px"><h3>Counter-offer</h3><p>${esc(ot.abbr)} would do it if you add ${ctr.add?`${esc(fullName(ctr.add))} (${ctr.add.pos}, ${ctr.add.ovr})`:`your ${ctr.addK.season} round ${ctr.addK.rd} pick`}.</p><div class="acts"><button class="btn s go" data-a="ctracc|${ctr.add?'p':'k'}|${ctr.add?ctr.add.id:L.picks.indexOf(ctr.addK)}">Add it</button></div></div>`:''}
   <div class="acts" style="margin-top:14px"><button class="btn go" data-a="propose" ${open?'':'disabled'}>${open?'Propose trade':'Trade window closed'}</button><button class="btn" data-a="tclear">Clear</button></div>`)}
  ${panel('Trade finder',canFind()?`<div class="fld"><label for="finder">Shop a player</label><select id="finder" data-in="finder"><option value="">Choose…</option>${orgOf(L.userTid).filter(p=>!p.mp).sort((a,b)=>b.ovr-a.ovr).map(p=>`<option value="${p.id}" ${UI.finder===p.id?'selected':''}>${p.pos} ${esc(fullName(p))} (${p.ovr})</option>`).join('')}</select></div>
   ${UI.finder?(()=>{const p=P(UI.finder);const f=p?tradeFinder(p):[];return f.length?f.map(o=>rowLine(`<div class="sm"><b>${esc(T(o.tid).abbr)}</b>: ${o.get.p.map(x=>`${esc(initials(x))} (${x.pos} ${x.ovr})`).concat(o.get.k.map(k=>`${k.season} R${k.rd}`)).join(' + ')}</div>`,`<button class="btn s" data-a="loadf|${o.tid}|${UI.finder}|${o.get.p.map(x=>x.id).join(',')}|${o.get.k.map(k=>L.picks.indexOf(k)).join(',')}">Load</button>`)).join(''):'<p class="dim" style="margin:0">No team is biting right now.</p>'})():''}`:'<p class="dim" style="margin:0">Unlock Trade finder in GM skills.</p>')}
  ${panel('Trade block',UT().block.length?`<div class="plist">${UT().block.map(P).filter(Boolean).map(p=>prow(p,{star:false})).join('')}</div>`:'<div class="empty">Empty. Add players from their profile.</div>',{raw:true})}`};
IN.ttid=v=>{UI.tradeTid=+v;UI.tsel.get={p:[],k:[]};render()};IN.finder=v=>{UI.finder=v?+v:null;render()};
A.tsel=(side,kind,id)=>{const s=UI.tsel[side];if(kind==='p'){id=+id;s.p=s.p.includes(id)?s.p.filter(x=>x!==id):[...s.p,id]}else{const k=L.picks[+id];s.k=s.k.includes(k)?s.k.filter(x=>x!==k):[...s.k,k]}render()};
A.ctracc=(kind,id)=>{const s=UI.tsel.give;if(kind==='p')s.p.push(+id);else s.k.push(L.picks[+id]);render()};
A.tclear=()=>{UI.tsel={give:{p:[],k:[]},get:{p:[],k:[]}};render()};
A.loadf=(tid,pid,ps,ks)=>{UI.tradeTid=+tid;UI.tsel={give:{p:[+pid],k:[]},get:{p:ps?ps.split(',').map(Number):[],k:ks?ks.split(',').map(i=>L.picks[+i]):[]}};render();window.scrollTo(0,0)};
A.propose=()=>{const tid=UI.tradeTid,S=UI.tsel;const give={p:S.give.p.map(P),k:S.give.k},get={p:S.get.p.map(P),k:S.get.k};const ev=evalTrade(tid,give,get);if(!ev.ok){toast(ev.reason,'bad');return}doTrade(tid,give,get);toast('Trade accepted','good');UI.tsel={give:{p:[],k:[]},get:{p:[],k:[]}};render()};
A.offer=(id,yn)=>{const o=(L.offers||[]).find(x=>x.id===id);if(!o)return;L.offers=L.offers.filter(x=>x!==o);if(yn==='yes'){const give={p:o.give.p.map(P).filter(p=>p&&p.tid===L.userTid),k:[]};const get={p:o.get.p.map(P).filter(p=>p&&p.tid===o.from),k:o.get.k.map(k=>L.picks.find(x=>x.season===k.season&&x.rd===k.rd&&x.orig===k.orig&&x.tid===o.from)).filter(Boolean)};
  if(!give.p.length){toast('That offer is no longer valid.','bad');render();return}const ev=evalTrade(o.from,give,get);if(ev.reason&&/cap/.test(ev.reason)){toast(ev.reason,'bad');render();return}doTrade(o.from,give,get);toast('Trade done','good')}save();render()};
A.block=id=>{const t=UT();id=+id;t.block=t.block.includes(id)?t.block.filter(x=>x!==id):[...t.block,id];save();if(UI.modal)renderModal();render()};

function faInterest(p){const s=faScore(p,{tid:L.userTid,sal:p.ask.sal,yrs:p.ask.yrs});return clamp((s-50)/40,0,1)}
TABS.fa=()=>{let ps=Object.values(L.players).filter(p=>p.tid===-1);if(UI.faF!=='ALL')ps=ps.filter(p=>p.pos===UI.faF);ps.sort((a,b)=>b.ovr-a.ovr);ps=ps.slice(0,80);const inFA=L.phase==='fa';
  const mine=Object.values(L.players).filter(p=>p.tid===-1&&p.offers&&p.offers.some(o=>o.tid===L.userTid));

  +(mine.length?panel('Your offers',`<div class="plist">${mine.map(p=>{const o=p.offers.find(x=>x.tid===L.userTid);return prow(p,{mid:`${money(o.sal)} × ${o.yrs}<br>${p.offers.length-1} RIVAL${p.offers.length===2?'':'S'}`})}).join('')}</div>`,{raw:true}):'')
  +`<div style="margin-bottom:12px">${posChips(UI.faF,'faf')}</div>`+panel('Available',`<div class="plist">${ps.map(p=>{const it=faInterest(p);return prow(p,{mid:`ASK ${money(p.ask.sal)}<br><span class="${it>=.66?'g':it>=.4?'y':'r'}">${it>=.66?'HIGH':it>=.4?'MED':'LOW'} INTEREST</span>`})}).join('')||'<div class="empty">Nobody here.</div>'}</div>`,{raw:true})};

/* ===== league screens ===== */
function stTable2(teams,o={}){return`<div class="tw"><table class="tbl z st"><thead><tr>${o.seed?'<th>#</th>':''}<th class="l">Team</th><th>GP</th><th>W</th><th>L</th><th>OTL</th><th>PTS</th><th>P%</th><th>RW</th><th>GF</th><th>GA</th><th>DIFF</th><th>STRK</th><th>L10</th></tr></thead><tbody>${teams.map((x,i)=>`<tr class="${x.tid===L.userTid?'me':''} ${o.cut&&i===o.cut-1?'cut':''}">${o.seed?`<td>${o.seed[i]||''}</td>`:''}<td class="l"><span class="tmi">${badge(x,24)}${esc(x.abbr)}${o.clinch&&o.clinch(x)?` <span class="xs ${o.clinch(x)==='e'?'r':'g'}">${o.clinch(x)==='e'?'e':o.clinch(x)}</span>`:''}</span></td><td>${gpOf(x)}</td><td>${x.rec.w}</td><td>${x.rec.l}</td><td>${x.rec.otl}</td><td><b>${pts(x)}</b></td><td>${f3(ptsPct(x))}</td><td>${x.rec.rw}</td><td>${x.rec.gf}</td><td>${x.rec.ga}</td><td class="${x.rec.gf>=x.rec.ga?'g':'r'}">${x.rec.gf-x.rec.ga>0?'+':''}${x.rec.gf-x.rec.ga}</td><td>${x.rec.strk>0?'W'+x.rec.strk:x.rec.strk<0?'L'+(-x.rec.strk):'—'}</td><td>${l10(x)}</td></tr>`).join('')}</tbody></table></div>`}
const dblk=(title,body)=>`<section class="dblk"><div class="dh">${title}</div>${body}</section>`;
function bracketHTML(){const po=L.po;const ser=s=>{const a=T(s.hi),b=T(s.lo);return`<div class="br"><div class="${s.done&&s.w===a.tid?'w':''}"><span class="tmi">${badge(a,20)}${esc(a.abbr)}</span><b>${s.wins[a.tid]}</b></div><div class="${s.done&&s.w===b.tid?'w':''}"><span class="tmi">${badge(b,20)}${esc(b.abbr)}</span><b>${s.wins[b.tid]}</b></div><small>${PO_ROUND[s.round]}${s.conf>=0?' · '+CONF[s.conf]:''}</small></div>`};
  return[0,1,2,3].map(r=>{const ss=po.series.filter(s=>s.round===r);return ss.length?dblk(PO_ROUND[r],`<div class="pb brk">${ss.map(ser).join('')}</div>`):''}).join('')+(po.champ!=null?`<div class="panel"><div class="pb g up">${CUP} champion: ${esc(teamName(T(po.champ)))}</div></div>`:'')}
/* magic: x = clinched playoff spot, e = eliminated */
function clinchFn(){if(L.phase!=='regular')return null;const left=t=>GAMES-gpOf(t);const mx=t=>pts(t)+2*left(t);const cut={};for(const c of[0,1]){const sd=seeds(c);const out=sortTeams(L.teams.filter(t=>t.conf===c&&!sd.all.includes(t.tid)));cut[c]={first:out[0],last:T(sd.wc[1])}}
  return t=>{const c=cut[t.conf];if(c.first&&pts(t)>mx(c.first)&&c.first!==t)return'x';if(c.last&&mx(t)<pts(c.last)&&c.last!==t)return'e';return''}}
TABS.standings=()=>{const v=UI.stdView||'div';let b='';const cf=clinchFn();
  if(v==='div')b=[0,1,2,3].map(d=>dblk(`${DIVN[d]} Division`,stTable2(sortTeams(L.teams.filter(t=>t.div===d)),{cut:3,clinch:cf}))).join('');
  else if(v==='wc')b=[0,1].map(c=>{const sd=seeds(c);const dv=sd.div;const rest=sortTeams(L.teams.filter(t=>t.conf===c&&!dv.flat().includes(t.tid)));return dblk(`${CONF[c]}ern Conference`,`<div class="lab" style="padding:12px 18px 4px">${DIVN[c*2]}</div>${stTable2(dv[0].map(T))}<div class="lab" style="padding:12px 18px 4px">${DIVN[c*2+1]}</div>${stTable2(dv[1].map(T))}<div class="lab" style="padding:12px 18px 4px">Wild card</div>${stTable2(rest,{cut:2,clinch:cf})}`)}).join('');
  else if(v==='conf')b=[0,1].map(c=>dblk(`${CONF[c]}ern Conference`,stTable2(sortTeams(L.teams.filter(t=>t.conf===c)),{clinch:cf}))).join('');
  else if(v==='league')b=dblk(LEAGUE_NAME,stTable2(sortTeams(L.teams)));
  else{if(L.po)b=bracketHTML();else b=[0,1].map(c=>{const sd=seeds(c);const[dA,dB]=sd.div;const aBetter=sortTeams([T(dA[0]),T(dB[0])])[0].tid===dA[0];const pr=[[dA[0],aBetter?sd.wc[1]:sd.wc[0]],[dA[1],dA[2]],[dB[0],aBetter?sd.wc[0]:sd.wc[1]],[dB[1],dB[2]]];
    return dblk(`${CONF[c]}ern Conference · if the season ended today`,`<div class="pb">${pr.map(([x,y])=>rowLine(`<span class="tmi">${badge(T(x),22)}${esc(T(x).abbr)} <span class="dim xs">${pts(T(x))}</span></span>`,`<span class="tmi"><span class="dim xs">${pts(T(y))}</span> ${esc(T(y).abbr)}${badge(T(y),22)}</span>`)).join('')}<p class="xs dim" style="margin-bottom:0">Top three in each division plus two wild cards per conference. Every round is best of seven.</p></div>`)}).join('')}
  return`<div class="pillrow">${pills('stdv',[['div','Division'],['wc','Wild card'],['conf','Conference'],['league','League'],['po','Playoffs']],v)}</div>${b}`};
A.stdv=v=>{UI.stdView=v;render()};
TABS.power=()=>{const rk=teamRanks();const pv=L.rkPrev||{};const pr=L.teams.slice().sort((a,b)=>rk[a.tid].pw-rk[b.tid].pw);

TABS.teamstat=()=>{const v=UI.tsv||'off';const rows=L.teams.map(t=>({t,x:teamSS(t)}));const gp=x=>Math.max(1,x.gp);
  const cols=v==='off'?[['GF/G',r=>r.x.gf/gp(r.x),2,-1],['SOG/G',r=>r.x.sog/gp(r.x),1,-1],['PP%',r=>r.x.ppo?r.x.ppg/r.x.ppo*100:0,1,-1],['PPG',r=>r.x.ppg,0,-1],['FO%',r=>r.x.fow+r.x.fol?r.x.fow/(r.x.fow+r.x.fol)*100:0,1,-1],['HIT',r=>r.x.hit,0,-1]]

function openNegotiate(id,ctx){const p=P(id);if(ctx==='extend'){p.ask=contractAsk(p,{neg:hasSkill('negotiator'),max:7,rfa:p.age<=26&&p.yrsPro<7});p.ask.sal=Math.max(p.ask.sal,p.con?p.con.sal:0)}if(!p.ask)p.ask=contractAsk(p);if(p.patience==null)p.patience=3;
  const cur=ctx==='fa'&&p.offers?p.offers.find(o=>o.tid===L.userTid):null;openM({type:'neg',id,ctx,sal:cur?cur.sal:p.ask.sal,yrs:cur?cur.yrs:Math.min(p.ask.yrs,ctx==='fa'||ctx==='sign'?6:7)})}
function reqSal(p,yrs){let r=p.ask.sal*(1-(p.per.loyal-50)/400-(p.morale-50)/350-((p.rel||50)-50)/500);if(Math.abs(yrs-p.ask.yrs)>1)r*=1.06;if(yrs>=6&&p.age>=30)r*=1.05;return r}
function negMood(p,m){if(m.ctx==='fa'){const th=[0,78,72,66,60,52][L.faDay]||50;const s=faScore(p,{tid:L.userTid,sal:m.sal,yrs:m.yrs});const comp=p.offers?p.offers.filter(o=>o.tid!==L.userTid).length:0;return{v:clamp((s-th+12)/24,0,1),l:s>=th+6?'Strong offer':s>=th-2?'Competitive':'Weak offer',note:comp?`${comp} other team${comp>1?'s have':' has'} offered.`:'No other offers yet.'}}
  if(m.ctx==='sign'){const v=m.sal/(p.ask.sal*.95);return{v:clamp(v,0,1),l:v>=1?"He'll sign":'Below his ask',note:''}}const v=m.sal/reqSal(p,m.yrs);return{v:clamp((v-.8)/.2,0,1),l:v>=1?"He'll sign":v>=.93?'Close':'Not close',note:`Patience: ${p.patience??3} tries left.`}}
function vNeg(m){const p=P(m.id);const t=p.tid>=0?T(p.tid):null;const md=negMood(p,m);const cs=capSpace(L.userTid);const old=p.con&&p.lvl==='PRO'?p.con.sal:0;const after=m.ctx==='fa'||m.ctx==='sign'?cs-m.sal:m.ctx==='resign'?cs+old-m.sal:cs;const mx=Math.max(3,Math.min(capMax(),Math.round(p.ask.sal*1.8*20)/20));const maxY=m.ctx==='fa'||m.ctx==='sign'?6:7;
  return`${scrTop({fa:'FREE AGENT OFFER',sign:'SIGN PLAYER',resign:'RE-SIGN',extend:'EXTENSION'}[m.ctx])}<div class="gut"><div class="hero">${avatar(p.id,80,t?t.c1:'#3a3a3a',t?t.c2:'#bbbbbb')}<div style="flex:1;min-width:0"><div class="sm dim up">${p.pos} · Age ${p.age}${p.rfa?' · RFA':''}</div><h2>${esc(fullName(p))}</h2><div class="dim">${esc(archetype(p))}${personaTraits(p).length?' · '+personaTraits(p).join(', '):''}</div></div>${ring(p.ovr,{s:76})}</div>
  ${panel('Terms',`<dl class="kv"><dt>Asking</dt><dd>${money(p.ask.sal,2)} × ${p.ask.yrs} yrs</dd><dt>Market value</dt><dd>${money(marketValue(p),2)}</dd>${p.con?`<dt>Current deal</dt><dd>${conStr(p)}</dd>`:''}<dt>Cap space after</dt><dd class="${after<0?'r':''}">${money(after,1)}</dd><dt>Max cap hit</dt><dd>${money(capMax())}</dd></dl>
  <div class="fld" style="margin-top:18px"><label for="neg-sal">Cap hit per season: <b style="color:#fff">${money(m.sal,2)}</b></label><input id="neg-sal" type="range" min="${L.minSal}" max="${mx}" step="0.05" value="${m.sal}" data-in="negsal"></div>
  <div class="fld"><label>Years (max ${maxY})</label>${seg('negyrs',Array.from({length:maxY},(_,i)=>[String(i+1),String(i+1)]),String(m.yrs))}</div>
  <div style="display:flex;justify-content:space-between" class="sm"><span class="dim">${esc(md.note)}</span><b class="${md.v>=1?'g':md.v>=.6?'y':'r'}">${md.l}</b></div><div style="margin-top:8px">${meter(md.v,md.v>=1?'var(--ring-g)':md.v>=.6?'var(--ring-y)':'var(--ring-r)')}</div>`)}
  <button class="btn go wide" data-a="negsubmit">${m.ctx==='fa'?'Submit offer':'Offer contract'}</button></div>`}
IN.negsal=v=>{UI.modal.sal=Math.round(+v*20)/20;renderModal()};A.negyrs=y=>{UI.modal.yrs=+y;renderModal()};
A.negsubmit=()=>{const m=UI.modal;const p=P(m.id);const sal=m.sal,yrs=m.yrs;
  if(m.ctx==='fa'){if(capOn()&&sal>capSpace(L.userTid)){toast(`You only have ${money(capSpace(L.userTid))} of cap space.`,'bad');return}p.offers=(p.offers||[]).filter(o=>o.tid!==L.userTid);p.offers.push({tid:L.userTid,sal,yrs});toast(`Offer sent. ${initials(p)} decides when you advance the day.`);closeM();save();render();return}
  if(m.ctx==='sign'){if(contractsOf(L.userTid).length>=ORG_MAX){toast(`You're at the ${ORG_MAX}-contract limit. Release someone first.`,'bad');return}if(capOn()&&sal>capSpace(L.userTid)){toast(`You only have ${money(capSpace(L.userTid))} of cap space.`,'bad');return}if(sal<p.ask.sal*.95){p.ask.sal=Math.round(p.ask.sal*1.02*20)/20;toast(`${initials(p)} wants more money.`,'bad');renderModal();return}
    signPlayer(p,L.userTid,sal,yrs);news(`Signed ${fullName(p)} (${p.pos}, ${p.ovr}): ${yrs} yr, ${money(sal)} AAV`,{pid:p.id,tid:L.userTid,kind:'fa'});toast(`${fullName(p)} signed`,'good');closeM();save();render();return}
  if(sal>=reqSal(p,yrs)){p.con={sal,yrs:m.ctx==='extend'?yrs+(p.con?p.con.yrs:0):yrs,len:yrs};p.expiring=false;p.rfa=false;p.morale=clamp(p.morale+6,0,100);
    news(`${fullName(p)} signed ${m.ctx==='extend'?'an extension':'a new deal'}: ${yrs} yr, ${money(sal)} AAV`,{pid:p.id,tid:L.userTid,kind:'contract'});toast('Deal done','good');gmXP(15);closeM();save();render();return}
  p.patience=(p.patience??3)-1;p.morale=clamp(p.morale-3,0,100);if(p.patience<=0){toast(`${initials(p)} is done talking.${m.ctx==='resign'?(p.rfa?' You can still qualify him.':" He'll test free agency."):''}`,'bad');closeM();render();return}toast(`${initials(p)} turned it down.`,'bad');renderModal()};

A.doedit=id=>{const p=P(+id);const v=k=>$('ed-'+k)?$('ed-'+k).value:null;p.fn=v('fn').trim()||p.fn;p.ln=v('ln').trim()||p.ln;p.age=clamp(+v('age')||p.age,16,45);p.dev=v('dev');for(const a of ATTR)if(v(a)!=null)p.r[a]=clamp(Math.round(+v(a)||p.r[a]),1,99);p.ovr=calcOvr(p);p.pot=clamp(Math.max(+v('pot')||p.pot,p.ovr),p.ovr,99);dirty();save();openM({type:'player',id:p.id,tab:'ratings'});render()};

/* ===== live game broadcast ===== */
const LV_MS=[950,430,170,28];
function startLive(g,onDone,o={}){const sp=L&&L.settings&&L.settings.speed!=null&&UI.view!=='mt'?+L.settings.speed:1;g.manual=g.manual||[false,false];UI.live={g,auto:true,speed:sp,onDone,timer:null,view:'feed',pt:g.user>=0?g.user:0,manage:!!o.manage,anim:null,pos:{},puck:{x:100,y:42.5},path:[],t0:0,flash:null,built:false,to:false};renderLive(true);liveLoop();animLoop()}
function liveLoop(){const lv=UI.live;if(!lv)return;clearTimeout(lv.timer);if(!lv.auto||lv.g.done){renderLive();return}liveStep();renderLive();if(UI.live&&lv.auto&&!lv.g.done)lv.timer=setTimeout(liveLoop,LV_MS[lv.speed])}
/* rink geometry: x 0-200, y 0-85. dir +1 means attacking toward x=200 */
const atkDir=(g,s)=>((s===0)===(g.per%2===1))?1:-1;
function puckTarget(g){const s=g.poss??0;const d=atkDir(g,s);const z=g.zone;const end=100+d*85;if(z===1)return{x:end-d*rnd(4,32),y:rnd(12,73)};if(z===0)return{x:100+d*rnd(-22,22),y:rnd(14,71)};return{x:100-d*rnd(55,86),y:rnd(12,73)}}
function liveFx(lv,n){const g=lv.g;if(lv.path.length){const q=lv.path[lv.path.length-1];lv.puck={x:q[0],y:q[1]}}const ev=g.log.slice(n);const pts=[];const tg=puckTarget(g);
  const sh=ev.filter(e=>['goal','save','miss','block'].includes(e.t)&&e.side!=null);for(const e of sh){const d=atkDir(g,e.side);const sx=100+d*(e.x-100),sy=d>0?e.y:85-e.y;pts.push([sx,sy]);const nx=100+d*89;pts.push(e.t==='goal'?[nx+d*1.5,42.5+rnd(-2,2)]:e.t==='save'?[nx-d*2,42.5+rnd(-3,3)]:e.t==='block'?[sx+d*6,sy]:[nx+d*rnd(2,6),R()<.5?rnd(20,36):rnd(49,65)])}
  const goal=ev.find(e=>e.t==='goal');if(goal){lv.flash={t:performance.now(),txt:goal.txt,side:goal.side};pts.push([100,42.5])}else pts.push([tg.x,tg.y]);lv.path=pts.length>5?pts.slice(-5):pts;lv.t0=performance.now()}
function liveStep(){const lv=UI.live;const g=lv.g;if(g.done)return;const n=g.log.length;const per=g.per;stepTick(g);liveFx(lv,n);
  const ev=g.log.slice(n);if(g.per!==per&&!g.done&&g.user>=0&&lv.manage){lv.auto=false;toast(g.so?'Shootout! Press play.':'Intermission. Make changes in Manage, or press play.')}
  if(ev.some(e=>e.t==='inj'&&e.side===g.user)&&lv.manage){const e=ev.find(x=>x.t==='inj');toast(e.txt,'bad')}}
A['lv-auto']=()=>{const lv=UI.live;if(lv.g.done)return;lv.auto=!lv.auto;liveLoop();renderLive()};
A['lv-slow']=()=>{const lv=UI.live;lv.speed=Math.max(0,lv.speed-1);renderLive()};A['lv-fast']=()=>{const lv=UI.live;lv.speed=Math.min(3,lv.speed+1);renderLive()};
A['lv-view']=v=>{UI.live.view=v;renderLive()};A['lv-pt']=v=>{UI.live.pt=+v;renderLive()};

A['lv-mgr']=()=>{const lv=UI.live;lv.auto=false;clearTimeout(lv.timer);renderLive();openM({type:'mgr'})};
/* manage: tactics, deployment, goalie, timeout */
function vMgr(){const lv=UI.live;if(!lv)return'';const g=lv.g;const u=g.user;const sd=g.sd[u];const gk=g.net[u];const left=(g.perLen-g.tick)*TICK;
  const on=g.on[u].sk.map(p=>{const e=Math.round((g.en[p.id]??1)*100);const s=g.st[p.id]||{};return`<div class="trow" style="grid-template-columns:44px minmax(0,1fr) auto auto"><span class="pp sm">${p.pos}</span><div style="min-width:0"><div>${esc(fullName(p))}</div><div class="sm dim">${s.gl?s.gl+' G · ':''}${s.a?s.a+' A · ':''}${mmss(s.toi||0)} TOI</div></div><span class="sm ${e>=60?'g':e>=40?'y':'r'}">${e}%</span>${ring(p.ovr,{s:40,lbl:''})}</div>`}).join('');

  ${panel('Tactics',`<div class="orow"><div class="ol">Forecheck</div>${pills('mgrtac|fc',FC_NAME.map((x,i)=>[i,x]),sd.strat.fc)}</div><div class="orow"><div class="ol">Physicality</div>${pills('mgrtac|phy',PHY_NAME.map((x,i)=>[i,x]),sd.strat.phy)}</div><div class="orow"><div class="ol">Shooting</div>${pills('mgrtac|shoot',SHOOT_NAME.map((x,i)=>[i,x]),sd.strat.shoot)}</div><div class="orow"><div class="ol">Deployment</div>${pills('mgrtac|ride',RIDE_NAME.map((x,i)=>[i,x]),sd.strat.ride??1)}</div>`)}
  ${panel('Bench',`<div class="acts">${g.pulled[u]?'<button class="btn go s" data-a="mgrg|back">Put the goalie back</button>':`<button class="btn s ${g.per>=3&&g.sc[u]<g.sc[1-u]?'go':''}" data-a="mgrg|pull" ${g.so?'disabled':''}>Pull the goalie</button>`}<button class="btn s" data-a="mgrg|swap" ${!sd.G[1]||g.pulled[u]?'disabled':''}>Change goalies</button><button class="btn s" data-a="mgrto" ${lv.to||g.so?'disabled':''}>Use timeout</button></div>
   <p class="sm dim" style="margin-bottom:0">In net: ${gk?esc(fullName(gk))+` · ${(g.st[gk.id]||{}).sv||0} saves on ${(g.st[gk.id]||{}).sa||0}`:'empty net'}. ${g.manual[u]?'You control the goalie pull.':'The coach pulls the goalie late when you trail.'} Timeout rests the line on the ice.</p>`)}

A.mgrtac=(k,v)=>{const lv=UI.live;lv.g.sd[lv.g.user].strat[k]=+v;renderModal()};

/* ---- rink canvas ---- */
function rinkPos(g,s,p,role,puck){const d=atkDir(g,s);const att=g.poss===s;const z=att?g.zone:-g.zone;const end=100+d*89,own=100-d*89;let x,y;
  if(role==='G'){const gx=own+d*3;return[gx,42.5+(puck.y-42.5)*.12]}
  const py=puck.y;
  if(att){if(z===1){if(role==='D1'){x=100+d*28;y=20}else if(role==='D2'){x=100+d*28;y=65}else if(role==='F1'){x=puck.x;y=py}else if(role==='F2'){x=end-d*18;y=40+(py>42?-6:6)}else{x=puck.x-d*10;y=85-py}}
    else if(z===0){if(role.startsWith('D')){x=100-d*24;y=role==='D1'?28:57}else if(role==='F1'){x=puck.x;y=py}else{x=puck.x+d*rnd(-4,10);y=role==='F2'?22:63}}
    else{if(role==='D1'){x=own+d*6;y=py}else if(role==='D2'){x=own+d*14;y=85-py}else if(role==='F1'){x=own+d*30;y=py<42?14:71}else if(role==='F2'){x=100-d*42;y=42}else{x=own+d*32;y=py<42?71:14}}}
  else{if(z===-1){if(role==='D1'){x=own+d*12;y=36}else if(role==='D2'){x=own+d*12;y=50}else if(role==='F1'){x=puck.x+d*5;y=py+(py>42?-5:5)}else if(role==='F2'){x=own+d*34;y=24}else{x=own+d*34;y=61}}
    else if(z===0){if(role.startsWith('D')){x=100-d*32;y=role==='D1'?30:55}else{x=puck.x-d*8;y=role==='F1'?py:role==='F2'?26:59}}

/* ---- moments ---- */
const mpDiff=()=>({easy:1.3,normal:1,hard:.78})[L.settings.mpDiff||'normal'];
const clutchOn=g=>g.per>=3&&Math.abs(g.sc[0]-g.sc[1])<=1;
const mzone=(skill,base,g)=>(base+skill*.0016)*mpDiff()*(1+(g&&clutchOn(g)?abl('clutch')*.12:0));
function startMoment(pd){const s=UI.mpg;const g=s.g;s.mode='moment';const mo={att:pd,kind:pd.kind||pd.role,phase:'choose',t0:performance.now(),txt:''};s.mo=mo;
  if(mo.kind==='shot'){mo.phase=pd.ctx==='bkwy'||pd.ctx==='ps'?'choose':'aim';mo.xg=pd.xg;mo.blockers=pd.danger==='L'?[{x:rnd(-.5,.5)},{x:rnd(-.5,.5)}]:pd.danger==='M'?[{x:rnd(-.5,.5)}]:[];mo.gx=0}
  else if(mo.kind==='pass')buildPassScene(g,mo);
  else if(mo.kind==='def')mo.phase='choose';
  else if(mo.kind==='fo'){mo.phase='ready';mo.drop=rnd(700,1700)}
  else if(mo.kind==='save'){mo.phase='ready';const pre=pd.pre||{out:'save'};const goal=pre.out==='goal';const sx=(R()<.5?-1:1)*(goal?rnd(.5,.92):rnd(0,.55));mo.target={x:sx,y:goal?(R()<.55?rnd(.55,.92):rnd(.06,.3)):rnd(.12,.62)};mo.T=(500+(pd.danger==='L'?260:pd.danger==='M'?120:0))*mpDiff()*(1+abl('calm')*.1)*(pd.ctx==='ps'?.9:1)}

  renderMpGame()}
function buildPassScene(g,mo){const s=g.mpSide;const sk=g.on[s].sk.filter(p=>p!==g.mp);const att=mo.att;const sh=att.shooter;const others=sk.filter(p=>p!==sh).sort((a,b)=>offR(b.r)-offR(a.r));
  mo.mates=[{p:sh,x:.5+rnd(-.08,.08),y:.32,q:1,lbl:att.danger==='H'?'In the slot':'Open for a shot'}];if(others[0])mo.mates.push({p:others[0],x:R()<.5?.18:.82,y:.22,q:1.25,lbl:'Back door'});if(others[1])mo.mates.push({p:others[1],x:.5+rnd(-.25,.25),y:.72,q:.55,lbl:'At the point'});
  mo.defs=[{x:.5+rnd(-.1,.1),y:.4},{x:rnd(.28,.4),y:.3},{x:rnd(.6,.72),y:.3},{x:.5+rnd(-.2,.2),y:.6}];mo.me={x:R()<.5?.2:.8,y:.55}}
function laneRisk(mo,m){let d=1;const ax=mo.me.x,ay=mo.me.y,bx=m.x,by=m.y;for(const q of mo.defs){const t=clamp(((q.x-ax)*(bx-ax)+(q.y-ay)*(by-ay))/((bx-ax)**2+(by-ay)**2),0,1);const px=ax+(bx-ax)*t,py=ay+(by-ay)*t;d=Math.min(d,Math.hypot(q.x-px,q.y-py))}return clamp((.42-d*2.1)*(1-abl('tape')*.18),.04,.42)}
const meterVal=(mo,per)=>{const ph=((performance.now()-mo.m0)%per)/per;return ph<.5?ph*2:2-ph*2};
function mpCanvasTap(ev){const s=UI.mpg;if(!s||s.mode!=='moment')return;const mo=s.mo;const cv=ev.currentTarget;const rc=cv.getBoundingClientRect();const px=(ev.clientX-rc.left)/rc.width*cv._w,py=(ev.clientY-rc.top)/rc.height*cv._h;
  if(mo.kind==='shot'){if(mo.phase==='aim'){const z=cv._toNet(px,py);mo.aim={x:clamp(z.x,-1.4,1.4),y:clamp(z.y,-.1,1.4)};mo.phase='meter';mo.m0=performance.now();renderMpGame()}else if(mo.phase==='meter')A.mpstop();return}

A.mpfo=()=>{const s=UI.mpg;const mo=s.mo;const g=s.g;const p=g.mp;if(mo.kind!=='fo')return;const now=performance.now()-mo.t0;
  if(mo.phase==='ready'){if(now<mo.drop){mo.early=true}mo.tap=now;mo.phase='done';const rt=now-mo.drop;const win=mzone(p.r.fo+abl('dot')*8,.06,g)*1500;const opp=mo.att.c[1-g.mpSide];let pw;if(mo.early)pw=.12;else if(rt<=win)pw=clamp(.62+(p.r.fo-opp.r.fo)*.008+(win-rt)/win*.18,.4,.94);else pw=clamp(.42+(p.r.fo-opp.r.fo)*.008-(rt-win)/900,.08,.6);
    const won=R()<pw;const side=won?g.mpSide:1-g.mpSide;mo.won=won;renderMpGame();setTimeout(()=>{if(UI.mpg!==s||s.mo!==mo)return;resolveFaceoff(g,mo.att,side);if(won)inc(g,p,'fow1');mpAfterMoment(null,mo.early?'Too early. Kicked out of the circle, and the draw goes the other way.':won?`You win the draw${mo.att.zone*(g.mpSide===0?1:-1)===1?' in the offensive zone':''}.`:rt>win*1.8?'Too slow. They beat you to it.':'Lost the draw.')},520)}};
A.mpstop=()=>{const s=UI.mpg;const mo=s.mo;const g=s.g;const p=g.mp;if(mo.phase!=='meter')return;const df=mpDiff();
  if(mo.kind==='shot'){const per=1000*df*(mo.att.type&&/One-timer|Slap/.test(mo.att.type)?.85:1);const m=meterVal(mo,per);mo.mval=m;const skill=p.r.sht*.6+p.r.pwr*.2+p.r.hnd*.2;const hw=mzone(skill,.05,g);const off=m-.5;const miss=Math.max(0,Math.abs(off)-hw);
    const sd=.05+(1-Math.min(.8,mo.xg||.3))*.16+miss*1.1+(100-skill)*.0016;const fx=mo.aim.x+gauss(0,sd),fy=mo.aim.y+gauss(0,sd*.8)+Math.max(0,off-hw)*1.1;mo.final={x:fx,y:fy};mo.power=clamp(.5+off+abl('cannon')*.05,0,1);
    const gk=mo.att.gk;const gv=gk?goalieV(g,gk,1-g.mpSide):40;let out;
    if(Math.abs(fx)>1.04||fy>1.04||fy<-.04)out=Math.abs(fx)<1.12&&fy<1.12&&fy>-.1?'post':'miss';else if(mo.blockers&&mo.blockers.some(b=>Math.abs(b.x-fx)<.2)&&fy<.5&&R()<.55)out='block';
    else{const r=clamp((.22+(gv-65)*.0055+(1-(mo.xg||.1))*.32)*(1.1-mo.power*.25)/Math.sqrt(df),.16,.72);const kp={x:mo.gx||0,y:.32};const d=Math.hypot(fx-kp.x,(fy-kp.y)*1.15);const corner=Math.abs(fx)>.7&&(fy>.65||fy<.18);out=d<r&&!(corner&&R()<.35)?'save':'goal';mo.kguess=clamp(fx,-1,1)*(out==='save'?1:.55)}
    mo.out=out;mo.phase='flight';mo.f0=performance.now();renderMpGame();setTimeout(()=>{if(UI.mpg===s&&s.mo===mo)shotDone(mo)},600);return}
  if(mo.kind==='deke'){const m=meterVal(mo,900*df);const hw=mzone(p.r.hnd+abl('mitts')*7,.045,g);const off=Math.abs(m-.5);const gk=mo.att.gk;const gv=gk?goalieV(g,gk,1-g.mpSide):40;
    const pr=clamp(.36+(p.r.hnd*.7+p.r.agi*.3-gv)*.012+abl('mitts')*.06+(off<=hw?.2:off<=hw*2?0:-.22),.06,.85);const ok=R()<pr;mo.out=ok?'goal':R()<.6?'save':'miss';mo.final={x:mo.dir*rnd(.55,.85),y:rnd(.08,.3)};mo.phase='flight';mo.f0=performance.now();renderMpGame();setTimeout(()=>{if(UI.mpg===s&&s.mo===mo)shotDone(mo)},600);return}
  if(mo.kind==='pass'){const m=meterVal(mo,1000*df);const hw=mzone(p.r.pas*.6+p.r.ofa*.4+abl('tape')*6,.045,g);const off=Math.max(0,Math.abs(m-.5)-hw);const risk=laneRisk(mo,mo.sel)*(1+off*3)+off*.6;const ok=R()>risk;mo.phase='flight';mo.f0=performance.now();mo.ok=ok;renderMpGame();
    setTimeout(()=>{if(UI.mpg!==s||s.mo!==mo)return;if(ok){const q=mo.sel.q*(1.05+(hw-Math.min(hw,Math.abs(m-.5)))*.8);if(g.show)g.show.score+=4;mpResolve({newShooter:mo.sel.p,xgMul:q,danger:mo.sel.lbl==='At the point'?'L':'H'},`Tape to tape to ${nm(mo.sel.p)}.`)}else{if(g.show)g.show.score-=2;mpResolve({stopped:true,txt:`${nm(p)}'s pass is picked off`},'Picked off.')}},560);return}
  if(mo.kind==='drive'){const m=meterVal(mo,900*df);const hw=mzone(p.r.hnd*.5+p.r.spd*.3+p.r.agi*.2,.04,g);const off=Math.abs(m-.5);const d=mo.att.def;const pr=clamp(.46+((p.r.hnd*.5+p.r.spd*.3+p.r.str*.2)-(d?defR(d.r):65))*.011+(off<=hw?.25:off<=hw*2?.05:-.25),.08,.9);const ok=R()<pr;mo.ok=ok;mo.phase='flight';mo.f0=performance.now();renderMpGame();
    setTimeout(()=>{if(UI.mpg!==s||s.mo!==mo)return;if(ok){const att=mo.att;att.a2=att.a1===p?null:att.a1;att.a1=att.shooter===p?null:att.shooter;att.shooter=p;att.xg=Math.min(.45,att.xg*1.6+.06);att.danger='H';att.type='Wrist shot from the slot';shotXY(att);s.mo={att,kind:'shot',phase:'aim',xg:att.xg,blockers:[],t0:performance.now(),txt:"You're in alone. Pick your spot."};renderMpGame()}else mpResolve({stopped:true,txt:`${d?nm(d):'The defender'} strips ${nm(p)}`},'He took it off you.')},520);return}

    setTimeout(()=>{if(UI.mpg!==s||s.mo!==mo)return;const inz=Math.abs(off)<=hw;const g2=s.g;
      if(k==='check'){if(inz&&R()<clamp(.66+(p.r.chk+p.r.str-a.r.str-a.r.agi)*.006,.35,.94)){inc(g2,p,'hit');g2.hits[g2.mpSide]++;if(g2.show)g2.show.score+=4;mpResolve({stopped:true,txt:`${nm(p)} drills ${nm(a)} and knocks the puck loose`},'Big hit! Puck loose.')}else if(off>hw*1.6&&R()<.6-abl('stick')*.08){if(g2.show)g2.show.score-=3;mpResolve({foul:true,ptype:[pick(['Interference','Boarding','Charging']),2]},'Late hit. Two minutes.')}else mpResolve({xgMul:1.35},'Whiffed. He blew right by you.')}

function shotDone(mo){const s=UI.mpg;const g=s.g;if(mo.so){const ok=mo.out==='goal';soResult(g,ok);if(g.show)g.show.score+=ok?8:-2;mpAfterMoment(null,ok?'Scores! You beat him.':mo.out==='post'?'Off the post!':'Stopped.');return}
  let out=mo.out;const msg=out==='goal'?'GOAL!':out==='save'?'Saved.':out==='block'?'Blocked.':out==='post'?'Off the post!':'Missed the net.';if(out==='post')out='miss';if(g.show)g.show.score+=out==='goal'?12:out==='save'?2:-1;mpResolve({out},msg)}
function mpResolve(res,msg){const s=UI.mpg;const g=s.g;const att=s.mo.att;const n=g.log.length;finishAttempt(g,att,res);mpAfterMoment(n,msg)}

    if(save&&abl('vacuum')&&R()<abl('vacuum')*.25)mo.att.reb=true;mpResolve({out:save?'save':'goal'},save?'What a save!':'It beats you.')},480)}

function setupMC(cv){const dpr=window.devicePixelRatio||1;const w=cv.clientWidth||340,h=cv.clientHeight||300;cv.width=w*dpr;cv.height=h*dpr;cv._w=w;cv._h=h;const ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);

function drawMoment(cv,s){const ctx=cv._ctx||(cv._ctx=setupMC(cv));const mo=s.mo;if(!mo)return;if(mo.kind==='shot'||mo.kind==='deke'||mo.kind==='save')drawNetView(ctx,cv,mo,s);else if(mo.kind==='fo')drawFaceoff(ctx,cv,mo,s);else drawZoneView(ctx,cv,mo,s)}
function drawGoalie(ctx,G,kx,ky,ang,col,col2,GW,GH,glove){const[kX,kY]=G(kx,ky);ctx.save();ctx.translate(kX,kY);ctx.rotate(ang);const u=GW/12;

  ctx.fillStyle=col;ctx.beginPath();ctx.roundRect?ctx.roundRect(-u*1.6,-u*1.4,u*3.2,u*3.2,u*.6):ctx.rect(-u*1.6,-u*1.4,u*3.2,u*3.2);ctx.fill();ctx.fillStyle=col2;ctx.fillRect(-u*1.6,u*.6,u*3.2,u*.35);
  ctx.fillStyle='#e8e8e8';ctx.beginPath();ctx.arc(0,-u*2.1,u*.95,0,7);ctx.fill();ctx.strokeStyle='#333';ctx.lineWidth=1.2;for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(i*u*.28,-u*2.6);ctx.lineTo(i*u*.28,-u*1.5);ctx.stroke()}
