<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tennis</title>
<style>
html,body{margin:0;height:100%;background:#101418;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}
#wrap{position:relative;width:100%;height:100%}
canvas{display:block;width:100%;height:100%;touch-action:none}
#score{position:absolute;top:10px;left:0;right:0;text-align:center;font-size:15px;font-weight:700;letter-spacing:.3px;text-shadow:0 1px 3px #000;pointer-events:none}
#score small{display:block;font-size:12px;font-weight:500;opacity:.85;margin-top:2px}
#hint{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:13px;opacity:.85;pointer-events:none;transition:opacity 1s}
#win{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(0,0,0,.6)}
#win[hidden]{display:none}
#win b{font-size:28px}
#win span{font-size:15px;opacity:.85}
#win button{background:#0a84ff;color:#fff;border:0;border-radius:20px;padding:12px 28px;font-size:17px;font-weight:700;cursor:pointer}
</style></head><body><div id="wrap">
<canvas id="c"></canvas>
<div id="score"></div>
<div id="hint">Drag to move · the racket swings on contact</div>
<div id="win" hidden><b id="winText"></b><span id="winScore"></span><button id="again">Play Again</button></div>
</div>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const scoreEl = document.getElementById('score'), hintEl = document.getElementById('hint');
const winEl = document.getElementById('win'), winText = document.getElementById('winText'), winScore = document.getElementById('winScore');
let W = 0, H = 0, court = {};
const player = { x: 0, y: 0, vx: 0, px: 0 };
const cpu = { x: 0, y: 0 };
const ball = { x: 0, y: 0, vx: 0, vy: 0, live: false };
let pts = [0, 0], games = [0, 0], server = 0, serving = false, serveTimer = 0, cpuErr = 0, matchOver = false, hintT = 0;
let flashes = [];
const PTS = ['0', '15', '30', '40'];
function layout() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  W = cv.clientWidth; H = cv.clientHeight;
  if (!W || !H) return;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  court = { left: W * 0.12, right: W * 0.88, top: H * 0.08, bottom: H * 0.92, net: H * 0.5 };
  player.x = Math.max(court.left, Math.min(court.right, player.x || W / 2));
  player.y = Math.max(court.net + 30, Math.min(H - 24, player.y || H * 0.84));
  cpu.x = Math.max(court.left, Math.min(court.right, cpu.x || W / 2));
  cpu.y = H * 0.16;
  ball.x = Math.max(0, Math.min(W, ball.x)); ball.y = Math.max(0, Math.min(H, ball.y));
}
function renderScore() {
  const p = pts[0], c = pts[1];
  let pt;
  if (p >= 3 && c >= 3) pt = p === c ? 'Deuce' : (p > c ? 'Adv You' : 'Adv CPU');
  else pt = PTS[p] + ' - ' + PTS[c];
  scoreEl.innerHTML = '<b>YOU ' + games[0] + ' &ndash; ' + games[1] + ' CPU</b><small>' + pt + ' &middot; ' + (server === 0 ? 'Your serve' : 'CPU serve') + ' &middot; First to 4 games wins</small>';
}
function placeServe() {
  if (server === 0) { ball.x = player.x; ball.y = player.y - 26; }
  else { ball.x = cpu.x; ball.y = cpu.y + 26; }
  ball.vx = 0; ball.vy = 0; ball.live = false;
}
function nextServe() {
  serving = true; serveTimer = 0.9;
  placeServe(); renderScore();
}
function resetMatch() {
  pts = [0, 0]; games = [0, 0]; server = 0; matchOver = false;
  winEl.hidden = true; hintT = 0; hintEl.style.opacity = 0.85;
  player.x = W / 2; player.y = H * 0.84; player.px = player.x; player.vx = 0;
  cpu.x = W / 2;
  nextServe();
}
function pointTo(w) {
  pts[w]++;
  const o = 1 - w;
  if (pts[w] >= 4 && pts[w] - pts[o] >= 2) {
    games[w]++; pts = [0, 0]; server = 1 - server;
    if (games[w] >= 4) {
      matchOver = true; ball.live = false; serving = false;
      winText.textContent = w === 0 ? 'You win the match!' : 'CPU wins the match.';
      winScore.textContent = 'YOU ' + games[0] + ' - ' + games[1] + ' CPU';
      winEl.hidden = false; renderScore(); return;
    }
  }
  nextServe();
}
function launchServe() {
  serving = false; ball.live = true;
  const speed = 300;
  ball.vy = server === 0 ? -speed : speed;
  ball.vx = (Math.random() * 2 - 1) * 70;
}
function hitBall(px, isPlayer) {
  const dir = isPlayer ? -1 : 1;
  const sp = Math.min(560, Math.hypot(ball.vx, ball.vy) * 1.03 + 8);
  ball.vy = dir * Math.abs(ball.vy) * 1.03;
  if (isPlayer) { const eng = Math.max(-180, Math.min(180, player.vx * 0.35)); ball.vx = (ball.x - px) * 0.28 + eng; }
  else { ball.vx = (ball.x - px) * 0.22 + (Math.random() * 2 - 1) * 18; cpuErr = (Math.random() * 2 - 1) * 14; }
  const m = Math.hypot(ball.vx, ball.vy) || 1;
  ball.vx = ball.vx / m * Math.min(560, sp); ball.vy = ball.vy / m * Math.min(560, sp);
  flashes.push({ x: ball.x, y: ball.y, t: 1 });
}
function update(dt) {
  if (matchOver) return;
  if (serving) {
    placeServe();
    serveTimer -= dt;
    if (serveTimer <= 0) launchServe();
    return;
  }
  if (!ball.live) return;
  const prevX = ball.x, prevY = ball.y;
  ball.x += ball.vx * dt; ball.y += ball.vy * dt;
  // Player contact: ball crossing the player's line on its way down.
  if (ball.vy > 0 && prevY <= player.y && ball.y >= player.y) {
    const t = (player.y - prevY) / (ball.y - prevY || 1);
    const xc = prevX + (ball.x - prevX) * t;
    if (Math.abs(xc - player.x) <= 28) { ball.x = xc; ball.y = player.y; hitBall(player.x, true); return; }
  }
  // CPU contact: ball crossing the CPU's line on its way up.
  if (ball.vy < 0 && prevY >= cpu.y && ball.y <= cpu.y) {
    const t = (cpu.y - prevY) / (ball.y - prevY || 1);
    const xc = prevX + (ball.x - prevX) * t;
    if (Math.abs(xc - cpu.x) <= 28) { ball.x = xc; ball.y = cpu.y; hitBall(cpu.x, false); return; }
  }
  // Baseline: in = defender missed, out = hitter missed.
  if (ball.y >= court.bottom) {
    const inB = ball.x >= court.left && ball.x <= court.right;
    ball.live = false; pointTo(inB ? 1 : 0); return;
  }
  if (ball.y <= court.top) {
    const inB = ball.x >= court.left && ball.x <= court.right;
    ball.live = false; pointTo(inB ? 0 : 1); return;
  }
  // CPU movement: track the ball when it comes up, drift home otherwise.
  let target;
  if (ball.vy < 0) {
    const t = (cpu.y - ball.y) / ball.vy;
    target = ball.x + ball.vx * Math.max(0, t) + cpuErr;
  } else target = (court.left + court.right) / 2;
  target = Math.max(court.left, Math.min(court.right, target));
  const cs = 265;
  if (cpu.x < target) cpu.x = Math.min(target, cpu.x + cs * dt);
  else cpu.x = Math.max(target, cpu.x - cs * dt);
}
function draw() {
  ctx.fillStyle = '#1b5e20'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#2e7d32'; ctx.fillRect(court.left, court.top, court.right - court.left, court.bottom - court.top);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
  ctx.strokeRect(court.left, court.top, court.right - court.left, court.bottom - court.top);
  const svcTop = court.net - (court.net - court.top) * 0.538;
  const svcBot = court.net + (court.bottom - court.net) * 0.538;
  ctx.beginPath();
  ctx.moveTo(court.left, svcTop); ctx.lineTo(court.right, svcTop);
  ctx.moveTo(court.left, svcBot); ctx.lineTo(court.right, svcBot);
  ctx.moveTo((court.left + court.right) / 2, svcTop); ctx.lineTo((court.left + court.right) / 2, svcBot);
  ctx.stroke();
  // Net.
  ctx.lineWidth = 5; ctx.strokeStyle = '#fff';
  ctx.beginPath(); ctx.moveTo(court.left - 8, court.net); ctx.lineTo(court.right + 8, court.net); ctx.stroke();
  ctx.lineWidth = 2;
  // Hit flashes.
  flashes = flashes.filter(f => f.t > 0);
  flashes.forEach(f => {
    ctx.strokeStyle = 'rgba(255,255,255,' + (f.t * 0.8) + ')'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(f.x, f.y, 10 + (1 - f.t) * 18, 0, 7); ctx.stroke(); f.t -= 0.05;
  });
  // Players as discs (no figures).
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#2f7cf6'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(player.x, player.y, 15, 0, 7); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#e5484d';
  ctx.beginPath(); ctx.arc(cpu.x, cpu.y, 15, 0, 7); ctx.fill(); ctx.stroke();
  // Ball.
  ctx.fillStyle = '#d4e157';
  ctx.beginPath(); ctx.arc(ball.x, ball.y, 7, 0, 7); ctx.fill();
}
// Input: drag to move (pointer), arrows/WASD to move (keys).
const keys = {};
window.addEventListener('pointermove', e => {
  const r = cv.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  player.px = player.x;
  player.x = Math.max(court.left, Math.min(court.right, x));
  player.y = Math.max(court.net + 30, Math.min(H - 24, y));
});
window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
document.getElementById('again').addEventListener('click', resetMatch);
window.addEventListener('resize', layout);
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  if (!W) layout();
  // Keyboard movement.
  const ks = 380 * dt;
  let moved = false;
  if (keys['arrowleft'] || keys['a']) { player.px = player.x; player.x -= ks; moved = true; }
  if (keys['arrowright'] || keys['d']) { player.px = player.x; player.x += ks; moved = true; }
  if (keys['arrowup'] || keys['w']) { player.y -= ks; moved = true; }
  if (keys['arrowdown'] || keys['s']) { player.y += ks; moved = true; }
  if (moved) {
    player.x = Math.max(court.left, Math.min(court.right, player.x));
    player.y = Math.max(court.net + 30, Math.min(H - 24, player.y));
    player.vx = (player.x - player.px) / Math.max(dt, 0.001) * 0.3 + player.vx * 0.7;
  } else if (Math.abs(player.x - player.px) > 0.01) {
    player.vx = (player.x - player.px) / Math.max(dt, 0.001) * 0.3 + player.vx * 0.7;
    player.px = player.x;
  } else player.vx *= 0.8;
  hintT += dt;
  if (hintT > 6) hintEl.style.opacity = 0;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
layout();
resetMatch();
requestAnimationFrame(frame);
</script></body></html>
